// ── ASSISTENTE IA ─────────────────────────────────────────────────────────
function AssistenteIA({onBack}){
  const [modo,setModo]=useState("escolha"); // escolha | adulto | kids
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [msgsKids,setMsgsKids]=useState([]);
  const [inputKids,setInputKids]=useState("");
  const [loadingKids,setLoadingKids]=useState(false);
  const bottomRef=useRef(null);
  const bottomKidsRef=useRef(null);

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);
  useEffect(()=>{bottomKidsRef.current?.scrollIntoView({behavior:"smooth"});},[msgsKids]);

  const SYSTEM_ADULTO=`Você é o AXION, um assistente virtual especializado em radioterapia oncológica. 
Seu papel é apoiar pacientes com informações claras, acolhedoras e confiáveis sobre:
- Radioterapia: como funciona, tipos, equipamentos, sessões
- Efeitos colaterais: fadiga, náusea, pele, dor, queda de cabelo, etc.
- Alimentação e cuidados durante o tratamento
- Saúde emocional, ansiedade, medo e bem-estar psicológico
- Direitos do paciente oncológico no Brasil (Lei dos 60 dias, FGTS, INSS, etc.)

Tom: acolhedor, empático, simples e encorajador. Como um amigo que entende de medicina.
IMPORTANTE: Sempre lembre o paciente que o médico responsável deve ser consultado para decisões clínicas.
Responda sempre em português brasileiro. Seja conciso mas completo. Use emojis com moderação.`;

  const SYSTEM_KIDS=`Você é o RAIO, o super-herói assistente do AXION para crianças em radioterapia!
Você explica tudo de forma MUITO simples, divertida e lúdica para crianças de 4 a 8 anos.
Use linguagem bem fácil, emojis coloridos, comparações com super-heróis, jogos e histórias.
Temas que você explica para as crianças:
- O que é radioterapia (o raio mágico que combate os vilõezinhos)
- Por que não dói durante a sessão
- Por que às vezes ficam cansados
- O que comer para ficar forte
- Como ser corajoso durante o tratamento
- Perguntas que crianças fazem sobre o hospital e as máquinas

NUNCA use linguagem médica complexa. Substitua termos técnicos por metáforas infantis.
Exemplo: células ruins = vilõezinhos; radioterapia = raio mágico; médico = guardião da saúde.
Responda sempre em português brasileiro. Use muitos emojis e seja super animado e encorajador!`;

  const sugestoesAdulto=[
    "O que é radioterapia?",
    "Quais são os efeitos colaterais mais comuns?",
    "O que posso comer durante o tratamento?",
    "Como lidar com a fadiga?",
    "Quais são meus direitos como paciente?",
    "Como cuidar da pele durante a radioterapia?",
    "É normal sentir ansiedade?",
    "Quanto tempo dura cada sessão?",
  ];

  const sugestoesKids=[
    "O que é o raio mágico?",
    "Por que não dói nada?",
    "Por que fico cansado às vezes?",
    "Tenho medo da máquina enorme!",
    "O que posso comer pra ficar forte?",
    "Quanto tempo dura a sessão?",
    "Posso brincar depois da sessão?",
  ];

  const enviar=async(pergunta,isKids=false)=>{
    const txt=(pergunta||(isKids?inputKids:input)).trim();
    if(!txt)return;
    isKids?setInputKids(""):setInput("");
    const novaMsgs=[...(isKids?msgsKids:msgs),{role:"user",content:txt}];
    isKids?setMsgsKids(novaMsgs):setMsgs(novaMsgs);
    isKids?setLoadingKids(true):setLoading(true);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:600,
          system:isKids?SYSTEM_KIDS:SYSTEM_ADULTO,
          messages:novaMsgs.map(m=>({role:m.role,content:m.content}))
        })
      });
      const data=await res.json();
      const reply=data.content?.[0]?.text||"Desculpe, não consegui responder agora. Tente novamente!";
      isKids?setMsgsKids(p=>[...p,{role:"assistant",content:reply}]):setMsgs(p=>[...p,{role:"assistant",content:reply}]);
    }catch(e){
      const err="Erro de conexão. Verifique sua internet e tente novamente.";
      isKids?setMsgsKids(p=>[...p,{role:"assistant",content:err}]):setMsgs(p=>[...p,{role:"assistant",content:err}]);
    }
    isKids?setLoadingKids(false):setLoading(false);
  };

  // TELA DE ESCOLHA
  if(modo==="escolha") return(
    <div style={{paddingBottom:100}}>
      <AreaHeader title="Assistente IA" icon="🤖" color={C.teal} onBack={onBack}/>

          <div style={{fontSize:44,marginBottom:12,animation:"float 2s ease infinite"}}>🤖</div>
          <div style={{fontSize:18,fontWeight:900,marginBottom:8,fontFamily:"'Space Grotesk',sans-serif"}}>Olá! Eu sou o AXION IA</div>
          <div style={{fontSize:13,color:C.muted,lineHeight:1.8}}>
            Estou aqui para responder suas dúvidas sobre radioterapia, efeitos colaterais, alimentação, direitos do paciente e muito mais.<br/><br/>
            <strong style={{color:C.text}}>Escolha o modo de conversa:</strong>
          </div>
        </div>

        {/* Modo adulto */}
        <button onClick={()=>setModo("adulto")} style={{width:"100%",background:`${C.teal}15`,border:`2px solid ${C.teal}55`,borderRadius:20,padding:"22px 20px",textAlign:"left",marginBottom:14,transition:"all 0.2s"}}>
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            <div style={{width:52,height:52,borderRadius:16,background:`linear-gradient(135deg,${C.teal},${C.blue})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>🧑</div>
            <div>
              <div style={{fontSize:15,fontWeight:900,color:C.teal,marginBottom:4}}>Modo Adulto</div>
              <div style={{fontSize:12,color:C.muted,lineHeight:1.5}}>Conversa clara e acolhedora sobre seu tratamento. Para pacientes e familiares.</div>
            </div>
            <div style={{color:C.teal,fontSize:22,marginLeft:"auto"}}>›</div>
          </div>
        </button>

        {/* Modo kids */}
        <button onClick={()=>setModo("kids")} style={{width:"100%",background:"rgba(255,209,102,0.12)",border:"2px solid rgba(255,209,102,0.5)",borderRadius:20,padding:"22px 20px",textAlign:"left",transition:"all 0.2s"}}>
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            <div style={{width:52,height:52,borderRadius:16,background:"linear-gradient(135deg,#ffd166,#ff9f43)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>⚡</div>
            <div>
              <div style={{fontSize:15,fontWeight:900,color:"#ffd166",marginBottom:4}}>Modo Kids — RAIO</div>
              <div style={{fontSize:12,color:C.muted,lineHeight:1.5}}>Super-herói que explica tudo de forma divertida para crianças de 4 a 8 anos!</div>
            </div>
            <div style={{color:"#ffd166",fontSize:22,marginLeft:"auto"}}>›</div>
          </div>
        </button>

        <div style={{marginTop:22,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:"14px 16px",fontSize:11,color:C.muted,lineHeight:1.7}}>
          ⚠️ O assistente IA fornece informações gerais educativas. Para decisões clínicas, consulte sempre seu médico responsável.
        </div>
      </div>
    </div>
  );

  // CHAT ADULTO
  if(modo==="adulto") return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
      {/* Header */}
      <div style={{background:`linear-gradient(135deg,${C.navyL},${C.navyM})`,padding:"48px 20px 16px",borderBottom:`1px solid ${C.navyM}`,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <button onClick={()=>setModo("escolha")} style={{background:C.navyL,border:`1px solid ${C.navyM}`,borderRadius:12,width:40,height:40,color:C.text,fontSize:18,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div style={{width:40,height:40,borderRadius:12,background:`linear-gradient(135deg,${C.teal},${C.blue})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🤖</div>
          <div>
            <div style={{fontSize:15,fontWeight:900}}>AXION IA</div>
            <div style={{fontSize:10,color:C.teal}}>● Online — pronto para ajudar</div>
          </div>
        </div>
        {/* Sugestões */}
        {msgs.length===0&&(
          <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4}}>
            {sugestoesAdulto.slice(0,4).map((s,i)=>(
              <button key={i} onClick={()=>enviar(s,false)} style={{flexShrink:0,background:`${C.teal}15`,border:`1px solid ${C.teal}44`,borderRadius:99,padding:"6px 14px",color:C.teal,fontSize:10,fontWeight:600,whiteSpace:"nowrap"}}>
                {s}
              </button>
            ))}
          </div>
        )}
      </div>

      {/* Mensagens */}
      <div style={{flex:1,overflowY:"auto",padding:"20px 16px",display:"flex",flexDirection:"column",gap:12}}>
        {msgs.length===0&&(
          <div style={{textAlign:"center",padding:"30px 20px"}}>
            <div style={{fontSize:42,marginBottom:12,animation:"float 2s ease infinite"}}>🤖</div>
            <div style={{fontSize:15,fontWeight:800,marginBottom:8}}>Olá! Como posso te ajudar?</div>
            <div style={{fontSize:12,color:C.muted,lineHeight:1.7,marginBottom:24}}>Pode me perguntar sobre radioterapia, efeitos colaterais, alimentação, direitos do paciente e muito mais!</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {sugestoesAdulto.map((s,i)=>(
                <button key={i} onClick={()=>enviar(s,false)} style={{background:C.navyL,border:`1px solid ${C.navyM}`,borderRadius:12,padding:"10px 10px",color:C.muted,fontSize:11,fontWeight:600,textAlign:"left",lineHeight:1.4}}>

function JogoMemoria(){
  const emojisBase=["🎈","🌟","🎨","🎮","🍭","🦄","🌈","⚽"];
  const embaralhar=()=>{
    const dobrado=[...emojisBase,...emojisBase];
    for(let i=dobrado.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [dobrado[i],dobrado[j]]=[dobrado[j],dobrado[i]];
    }
    return dobrado.map((e,i)=>({id:i,emoji:e,virada:false,achada:false}));
  };
  const [cartas,setCartas]=useState(embaralhar);
  const [viradas,setViradas]=useState([]);
  const [jogadas,setJogadas]=useState(0);
  const [travado,setTravado]=useState(false);
  const [venceu,setVenceu]=useState(false);
  const [boom,setBoom]=useState(false);

  const total=emojisBase.length;
  const achadas=cartas.filter(c=>c.achada).length/2;

  const virar=(idx)=>{
    if(travado||cartas[idx].virada||cartas[idx].achada||viradas.length===2)return;
    const novas=cartas.map((c,i)=>i===idx?{...c,virada:true}:c);
    setCartas(novas);
    const novasViradas=[...viradas,idx];
    setViradas(novasViradas);
    if(novasViradas.length===2){
      setJogadas(j=>j+1);
      setTravado(true);
      const [a,b]=novasViradas;
      if(novas[a].emoji===novas[b].emoji){
        setTimeout(()=>{
          setCartas(cs=>cs.map((c,i)=>i===a||i===b?{...c,achada:true}:c));
          setViradas([]);
          setTravado(false);
          if(achadas+1===total){
            setVenceu(true);setBoom(true);
            setTimeout(()=>setBoom(false),1500);
          }
        },500);
      }else{
        setTimeout(()=>{
          setCartas(cs=>cs.map((c,i)=>i===a||i===b?{...c,virada:false}:c));
          setViradas([]);
          setTravado(false);
        },900);
      }
    }
  };

  const reiniciar=()=>{setCartas(embaralhar());setViradas([]);setJogadas(0);setTravado(false);setVenceu(false);};

  return(
    <div style={{padding:"4px 0"}}>
      <BoomEffect on={boom}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:12,color:C.muted}}>Pares achados: <strong style={{color:C.text}}>{achadas}/{total}</strong></div>
        <div style={{fontSize:12,color:C.muted}}>Jogadas: <strong style={{color:C.text}}>{jogadas}</strong></div>
      </div>
      {venceu&&(
        <div style={{background:`${C.gold}18`,border:`2px solid ${C.gold}66`,borderRadius:18,padding:"16px",textAlign:"center",marginBottom:14,animation:"popIn 0.4s ease"}}>
          <div style={{fontSize:32,marginBottom:6}}>🏆</div>
          <div style={{fontSize:14,fontWeight:900,color:C.gold}}>Parabéns! Você achou todos os pares!</div>
          <div style={{fontSize:11,color:C.muted,marginTop:4}}>{jogadas} jogadas no total</div>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
        {cartas.map((c,i)=>(
          <div key={c.id} onClick={()=>virar(i)} style={{
            aspectRatio:"1",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:26,cursor:c.achada?"default":"pointer",
            background:c.achada?`${C.green}22`:c.virada?C.navyM:`linear-gradient(135deg,${C.teal}33,${C.blue}33)`,
            border:`2px solid ${c.achada?C.green+"66":c.virada?C.teal+"66":"rgba(255,255,255,0.12)"}`,
            transition:"all 0.25s",boxShadow:c.achada?`0 0 12px ${C.green}33`:"none"
          }}>
            {c.virada||c.achada?c.emoji:"❔"}
          </div>
        ))}
      </div>
      <button onClick={reiniciar} style={{width:"100%",padding:"13px",borderRadius:14,border:`1.5px solid ${C.teal}55`,background:"transparent",color:C.teal,fontWeight:800,fontSize:13}}>
        🔄 Jogar de novo
      </button>
    </div>
  );
}

function JogoVelha(){
  const linhas=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const [tab,setTab]=useState(Array(9).fill(null));
  const [vez,setVez]=useState("X");
  const [placar,setPlacar]=useState({X:0,O:0,empate:0});

  const vencedor=(()=>{
    for(const [a,b,c] of linhas){
      if(tab[a]&&tab[a]===tab[b]&&tab[a]===tab[c])return{jogador:tab[a],linha:[a,b,c]};
    }
    return null;
  })();
  const cheio=tab.every(v=>v);

  const jogar=(i)=>{
    if(tab[i]||vencedor)return;
    const novo=[...tab];novo[i]=vez;setTab(novo);
    if(!vencedor)setVez(v=>v==="X"?"O":"X");
  };

  useEffect(()=>{
    if(vencedor)setPlacar(p=>({...p,[vencedor.jogador]:p[vencedor.jogador]+1}));
    else if(cheio)setPlacar(p=>({...p,empate:p.empate+1}));
    // eslint-disable-next-line
  },[vencedor,cheio]);

  const reiniciar=()=>{setTab(Array(9).fill(null));setVez("X");};

  return(
    <div style={{padding:"4px 0"}}>
      <div style={{fontSize:11,color:C.muted,textAlign:"center",marginBottom:12}}>Jogo pra dois — um joga ❌ e o outro joga ⭕, revezando no mesmo aparelho.</div>
      <div style={{display:"flex",justifyContent:"center",gap:20,marginBottom:16}}>
        {[["X","❌",C.blue],["empate","🤝",C.muted],["O","⭕",C.pink]].map(([k,label,col])=>(
          <div key={k} style={{textAlign:"center"}}>
            <div style={{fontSize:18}}>{label}</div>
            <div style={{fontSize:16,fontWeight:900,color:col}}>{placar[k]}</div>
          </div>
        ))}
      </div>
      {!vencedor&&!cheio&&(
        <div style={{textAlign:"center",fontSize:13,fontWeight:800,color:vez==="X"?C.blue:C.pink,marginBottom:12}}>
          Vez de {vez==="X"?"❌":"⭕"}
        </div>
      )}
      {vencedor&&(
        <div style={{textAlign:"center",fontSize:14,fontWeight:900,color:C.gold,marginBottom:12,animation:"popIn 0.4s ease"}}>
          🎉 {vencedor.jogador==="X"?"❌":"⭕"} venceu!
        </div>
      )}
      {!vencedor&&cheio&&(
        <div style={{textAlign:"center",fontSize:14,fontWeight:800,color:C.muted,marginBottom:12}}>🤝 Empate!</div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,maxWidth:260,margin:"0 auto 16px"}}>
        {tab.map((v,i)=>(
          <div key={i} onClick={()=>jogar(i)} style={{
            aspectRatio:"1",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,
            background:vencedor&&vencedor.linha.includes(i)?`${C.gold}33`:"rgba(255,255,255,0.05)",
            border:`2px solid ${vencedor&&vencedor.linha.includes(i)?C.gold:"rgba(255,255,255,0.12)"}`,
            cursor:v||vencedor?"default":"pointer"
          }}>
            {v==="X"?"❌":v==="O"?"⭕":""}
          </div>
        ))}
      </div>
      <button onClick={reiniciar} style={{width:"100%",padding:"13px",borderRadius:14,border:`1.5px solid ${C.teal}55`,background:"transparent",color:C.teal,fontWeight:800,fontSize:13}}>
        🔄 Nova partida
      </button>
    </div>
  );
}

function QuizDiversao(){
  const perguntas=[
    {p:"Qual é o maior órgão do corpo humano?",opcoes:["Fígado","Pele","Pulmão","Coração"],certa:1},
    {p:"Rir por 1 minuto pode equivaler a quantos minutos de exercício leve?",opcoes:["1 minuto","10 minutos","45 minutos","Nenhum"],certa:1},
    {p:"Qual desses alimentos é rico em vitamina C?",opcoes:["Laranja","Arroz","Queijo","Manteiga"],certa:0},
    {p:"Quantos litros de água, em média, recomenda-se beber por dia?",opcoes:["0,5L","1L","2L","5L"],certa:2},
    {p:"O coração humano bate, em média, quantas vezes por minuto em repouso?",opcoes:["20-40","60-100","150-200","300+"],certa:1},
    {p:"Qual desses hábitos ajuda a reduzir o estresse?",opcoes:["Dormir mal","Respiração profunda","Pular refeições","Ficar sem se mexer"],certa:1},
    {p:"Qual planeta é conhecido como o 'planeta vermelho'?",opcoes:["Vênus","Marte","Júpiter","Saturno"],certa:1},
    {p:"Quantos ossos tem, em média, o corpo de um adulto?",opcoes:["106","156","206","306"],certa:2},
  ];
  const [ordem]=useState(()=>[...perguntas].sort(()=>Math.random()-0.5));
  const [i,setI]=useState(0);
  const [acertos,setAcertos]=useState(0);
  const [escolha,setEscolha]=useState(null);
  const [fim,setFim]=useState(false);

  const atual=ordem[i];
  const responder=(idx)=>{
    if(escolha!==null)return;
    setEscolha(idx);
    if(idx===atual.certa)setAcertos(a=>a+1);
  };
  const proxima=()=>{
    if(i+1<ordem.length){setI(i+1);setEscolha(null);}
    else setFim(true);
  };
  const reiniciar=()=>{setI(0);setAcertos(0);setEscolha(null);setFim(false);};

  if(fim)return(
    <div style={{textAlign:"center",padding:"20px 0"}}>
      <div style={{fontSize:48,marginBottom:10}}>{acertos===ordem.length?"🏆":acertos>=ordem.length/2?"🎉":"💪"}</div>
      <div style={{fontSize:18,fontWeight:900,marginBottom:6}}>Você acertou {acertos} de {ordem.length}!</div>
      <div style={{fontSize:12,color:C.muted,marginBottom:20}}>{acertos===ordem.length?"Mandou muito bem!":"Bora jogar de novo?"}</div>
      <button onClick={reiniciar} style={{padding:"13px 28px",borderRadius:14,border:"none",background:`linear-gradient(135deg,${C.teal},${C.blue})`,color:C.navy,fontWeight:800,fontSize:14}}>
        🔄 Jogar de novo
      </button>
    </div>
  );

  return(
    <div style={{padding:"4px 0"}}>
      <div style={{fontSize:11,color:C.muted,marginBottom:10}}>Pergunta {i+1} de {ordem.length} · Acertos: {acertos}</div>
      <div style={{height:5,background:C.navyM,borderRadius:99,overflow:"hidden",marginBottom:18}}>
        <div style={{width:`${(i/ordem.length)*100}%`,height:"100%",background:`linear-gradient(90deg,${C.teal},${C.blue})`,borderRadius:99,transition:"width 0.3s"}}/>
      </div>
      <div style={{fontSize:15,fontWeight:800,marginBottom:16,lineHeight:1.5}}>{atual.p}</div>
      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
        {atual.opcoes.map((op,idx)=>{
          const escolhida=escolha===idx;
          const eCerta=idx===atual.certa;
          let bg="rgba(255,255,255,0.04)",border="rgba(255,255,255,0.12)",color=C.text;
          if(escolha!==null){
            if(eCerta){bg=`${C.green}22`;border=C.green;color=C.green;}
            else if(escolhida){bg=`${C.pink}22`;border=C.pink;color=C.pink;}
          }
          return(
            <button key={idx} onClick={()=>responder(idx)} style={{textAlign:"left",padding:"13px 16px",borderRadius:14,border:`2px solid ${border}`,background:bg,color,fontWeight:700,fontSize:13,transition:"all 0.2s"}}>
              {op} {escolha!==null&&eCerta?"✓":escolha!==null&&escolhida?"✗":""}
            </button>
          );
        })}
      </div>
      {escolha!==null&&(
        <button onClick={proxima} style={{width:"100%",padding:"13px",borderRadius:14,border:"none",background:`linear-gradient(135deg,${C.teal},${C.blue})`,color:C.navy,fontWeight:800,fontSize:14}}>
          {i+1<ordem.length?"Próxima →":"Ver resultado 🏁"}
        </button>
      )}
    </div>
  );
}

  const [contagem,setContagem]=useState(fases[0].seg);
  const [rodando,setRodando]=useState(false);
  const [ciclos,setCiclos]=useState(0);

  useEffect(()=>{
    if(!rodando)return;
    const t=setInterval(()=>{
      setContagem(c=>{
        if(c<=1){
          setFaseIdx(f=>{
            const prox=(f+1)%fases.length;
            if(prox===0)setCiclos(n=>n+1);
            setContagem(fases[prox].seg);
            return prox;
          });
          return fases[faseIdx].seg;
        }
        return c-1;
      });
    },1000);
    return ()=>clearInterval(t);
    // eslint-disable-next-line
  },[rodando,faseIdx]);

  const iniciar=()=>{setRodando(true);setFaseIdx(0);setContagem(fases[0].seg);setCiclos(0);};
  const parar=()=>{setRodando(false);};

  const fase=fases[faseIdx];

  return(
    <div style={{padding:"10px 0 4px",textAlign:"center"}}>
      <div style={{fontSize:12,color:C.muted,marginBottom:24,lineHeight:1.7}}>Um exercício simples para relaxar enquanto espera. Siga o ritmo do círculo — bom para adultos e crianças.</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:200,marginBottom:20}}>
        <div style={{
          width:120,height:120,borderRadius:"50%",
          background:`radial-gradient(circle,${C.teal}55,${C.teal}11)`,
          border:`3px solid ${C.teal}`,display:"flex",alignItems:"center",justifyContent:"center",
          transform:`scale(${rodando?fase.escala:1})`,
          transition:`transform ${rodando?fase.seg:0.4}s ease-in-out`,
          boxShadow:`0 0 40px ${C.teal}44`
        }}>
          <span style={{fontSize:28,fontWeight:900,color:C.teal,fontFamily:"'Space Grotesk',sans-serif"}}>{rodando?contagem:"🌬️"}</span>
        </div>
      </div>
      <div style={{fontSize:16,fontWeight:800,marginBottom:6,minHeight:22}}>{rodando?fase.label:"Pronto para começar?"}</div>
      <div style={{fontSize:11,color:C.muted,marginBottom:22}}>{rodando?`Ciclos completos: ${ciclos}`:"Toque em começar quando estiver confortável"}</div>
      {!rodando?(
        <button onClick={iniciar} style={{padding:"14px 32px",borderRadius:14,border:"none",background:`linear-gradient(135deg,${C.teal},${C.blue})`,color:C.navy,fontWeight:800,fontSize:14}}>
          ▶️ Começar a respirar
        </button>
      ):(
        <button onClick={parar} style={{padding:"14px 32px",borderRadius:14,border:`1.5px solid ${C.pink}66`,background:"transparent",color:C.pink,fontWeight:800,fontSize:14}}>
          ⏸️ Parar
        </button>
      )}
    </div>
  );
}

function Jogos({onBack}){
  const [tab,setTab]=useState("memoria");
  const color=C.gold;
  return(
    <div style={{paddingBottom:100}}>
      <AreaHeader title="Jogos & Diversão" icon="🎮" color={color} onBack={onBack}/>
      <div style={{padding:"0 20px 10px"}}>
        <div style={{fontSize:12,color:C.muted,lineHeight:1.6,marginBottom:16}}>
          Para entreter enquanto espera pelo tratamento — sozinho(a), com a família ou com a criançada. 🎈
        </div>
      </div>
      <TabBar tabs={["memoria","velha","quiz","respirar"]} labels={["🧠 Memória","❌⭕ Velha","🧩 Quiz","🌬️ Respirar"]} active={tab} onChange={setTab} color={color}/>

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────────────
function Nav({page,onNav}){
  const items=[
    {id:"home",    icon:"🏠", label:"Início"},
    {id:"paciente",icon:"📊", label:"Meu Perfil"},
    {id:"ia",      icon:"🤖", label:"IA AXION"},
    {id:"direitos",icon:"⚖️", label:"Direitos"},
    {id:"profissional",icon:"🏥",label:"Profissional"},
  ];
  return(
    <div style={{position:"fixed",bottom:0,left:0,right:0,width:"100%",maxWidth:430,margin:"0 auto",background:C.navyL,borderTop:`1px solid ${C.navyM}`,display:"flex",padding:"8px 0 14px",zIndex:100,backdropFilter:"blur(20px)"}}>
      {items.map(item=>(
        <button key={item.id} onClick={()=>onNav(item.id)} style={{flex:1,background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"4px 0"}}>
          <div style={{
            fontSize:item.id==="ia"?22:20,
            filter:page===item.id?"none":"grayscale(80%) opacity(0.45)",
            transition:"filter 0.2s",
            ...(item.id==="ia"&&page===item.id?{filter:"drop-shadow(0 0 6px rgba(0,201,177,0.6))"}:{})
          }}>{item.icon}</div>
          <div style={{fontSize:10,fontWeight:700,color:page===item.id?C.teal:C.muted,transition:"color 0.2s"}}>{item.label}</div>
          {item.id==="ia"&&<div style={{width:4,height:4,borderRadius:"50%",background:C.teal,boxShadow:`0 0 4px ${C.teal}`,marginTop:-2}}/>}
        </button>
      ))}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const [splash,setSplash]=useState(true);
  const [page,setPage]=useState("home");
  const [perfil,setPerfil]=useState(null);
  const [pronto,setPronto]=useState(false);

  // ao abrir o app, verifica se já existe uma sessão salva neste dispositivo
  useEffect(()=>{
    try{
      const codigoSessao=localStorage.getItem("axion_sessao_ativa");
      if(codigoSessao){
        const todos=JSON.parse(localStorage.getItem("axion_pacientes")||"{}");
        if(todos[codigoSessao]) setPerfil(todos[codigoSessao]);
      }
    }catch(e){}
    setPronto(true);
  },[]);

  const entrar=(p)=>{
    setPerfil(p);
    try{localStorage.setItem("axion_sessao_ativa",p.codigo);}catch(e){}
    setPage("home");
  };

  const sair=()=>{
    try{localStorage.removeItem("axion_sessao_ativa");}catch(e){}
    setPerfil(null);
    setPage("home");
  };

  const screens={
    home:       <Home onNav={setPage} perfil={perfil}/>,
    paciente:   <Paciente onBack={()=>setPage("home")} perfil={perfil} onSair={sair}/>,
    feminina:   <Feminina onBack={()=>setPage("home")}/>,
    masculina:  <Masculina onBack={()=>setPage("home")}/>,
    kids:       <Kids onBack={()=>setPage("home")}/>,
    profissional:<Profissional onBack={()=>setPage("home")}/>,
    direitos:   <Direitos onBack={()=>setPage("home")}/>,
    jogos:      <Jogos onBack={()=>setPage("home")}/>,
    ia:         <AssistenteIA onBack={()=>setPage("home")}/>,
  };

  const mostrarLogin=pronto&&!splash&&!perfil;

  return(
    <div style={{fontFamily:"'Nunito','Segoe UI',sans-serif",background:C.navy,color:C.text,minHeight:"100vh"}}>
      <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0,background:"radial-gradient(ellipse at 20% 20%,rgba(0,201,177,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(79,195,247,0.07) 0%,transparent 50%)"}}/>
      {splash&&<Splash onDone={()=>setSplash(false)}/>}
      {mostrarLogin&&<TelaAcesso onEntrar={entrar}/>}
      {pronto&&!splash&&perfil&&(
        <>
          <div style={{maxWidth:430,margin:"0 auto",position:"relative",zIndex:1,paddingBottom:70}}>
            {screens[page]||screens.home}
          </div>
          <Nav page={page} onNav={setPage}/>
        </>
      )}
    </div>
  );
}

// ── PROTEÇÃO CONTRA ERROS INESPERADOS ─────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={temErro:false};}
  static getDerivedStateFromError(){return{temErro:true};}
  componentDidCatch(erro,info){console.error("AXION - erro capturado:",erro,info);}
  render(){
    if(this.state.temErro){
      return(
        <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 28px",textAlign:"center",background:C.navy,color:C.text}}>
          <div style={{fontSize:48,marginBottom:14}}>😕</div>
          <div style={{fontSize:18,fontWeight:900,marginBottom:8}}>Ops, algo deu errado</div>
          <div style={{fontSize:13,color:C.muted,lineHeight:1.7,marginBottom:24,maxWidth:320}}>Tivemos um problema inesperado. Seus dados salvos neste aparelho não foram apagados. Tente recarregar a página.</div>
          <button onClick={()=>window.location.reload()} style={{padding:"14px 32px",borderRadius:14,border:"none",background:`linear-gradient(135deg,${C.teal},${C.blue})`,color:C.navy,fontWeight:800,fontSize:14}}>
            🔄 Recarregar
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
