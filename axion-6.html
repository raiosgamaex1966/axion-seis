<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AXION - Radioterapia Humanizada</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0a1628;font-family:'Nunito',sans-serif;color:#e8f4f8;height:auto;}
::-webkit-scrollbar{display:none;}
body{overflow-y:auto;}
button{font-family:'Nunito',sans-serif;cursor:pointer;}
textarea{font-family:'Nunito',sans-serif;}
input[type=range]{-webkit-appearance:none;width:100%;height:7px;background:#1a3560;border-radius:99px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#00c9b1;cursor:pointer;box-shadow:0 0 6px rgba(0,201,177,0.5);}
@keyframes fadeOut{to{opacity:0;pointer-events:none;}}
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
@keyframes barFill{from{width:0%;}to{width:100%;}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes popIn{0%{transform:scale(0) rotate(-10deg);opacity:0;}70%{transform:scale(1.2) rotate(3deg);}100%{transform:scale(1) rotate(0deg);opacity:1;}}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0deg);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(720deg);}}
@keyframes levelUp{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3);}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}80%{transform:translate(-50%,-50%) scale(0.95);}100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}
@keyframes blink{0%,100%{opacity:0.3;}50%{opacity:1;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

// ── CORES ──────────────────────────────────────────────────────────────────
const C={
  navy:"#0a1628",navyL:"#112240",navyM:"#1a3560",
  teal:"#00c9b1",pink:"#ff6b9d",blue:"#4fc3f7",
  gold:"#ffd166",purple:"#b39ddb",green:"#81c784",
  orange:"#ff9f43",red:"#ff6b6b",
  text:"#e8f4f8",muted:"#7a9bb5",
};

// ── UTILITÁRIOS ───────────────────────────────────────────────────────────
function BackBtn({onBack}){
  return <button onClick={onBack} style={{background:C.navyL,border:`1px solid ${C.navyM}`,borderRadius:12,width:40,height:40,color:C.text,fontSize:18,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>;
}

function AreaHeader({title,icon,color,onBack}){
  return(
    <div style={{padding:"48px 20px 18px",display:"flex",alignItems:"center",gap:14}}>
      <BackBtn onBack={onBack}/>
      <span style={{fontSize:26}}>{icon}</span>
      <span style={{fontSize:19,fontWeight:900,color,fontFamily:"'Space Grotesk',sans-serif"}}>{title}</span>
    </div>
  );
}

function TabBar({tabs,labels,active,onChange,color}){
  return(
    <div style={{display:"flex",gap:4,margin:"0 20px 20px",background:C.navyL,borderRadius:14,padding:5,border:`1px solid ${C.navyM}`}}>
      {tabs.map((t,i)=>(
        <button key={t} onClick={()=>onChange(t)} style={{
          flex:1,padding:"9px 2px",borderRadius:10,border:"none",
          background:active===t?`${color}22`:"transparent",
          color:active===t?color:C.muted,
          fontWeight:active===t?800:600,fontSize:10,
          borderBottom:active===t?`2px solid ${color}`:"2px solid transparent",
          transition:"all 0.2s"
        }}>{labels[i]}</button>
      ))}
    </div>
  );
}

// ── GAMIFICAÇÃO ENGINE ────────────────────────────────────────────────────
function useGameEngine(maxXp=300){
  const [xp,setXp]=useState(0);
  const [level,setLevel]=useState(1);
  const [points,setPoints]=useState(0);
  const [streak,setStreak]=useState(4);
  const [showLevelUp,setShowLevelUp]=useState(false);
  const [totalDone,setTotalDone]=useState(0);

  const addReward=(earnXp,earnPts)=>{
    setPoints(p=>p+earnPts);
    setTotalDone(t=>t+1);
    setXp(x=>{
      const n=x+earnXp;
      if(n>=maxXp){
        setLevel(l=>l+1);
        setShowLevelUp(true);
        setTimeout(()=>setShowLevelUp(false),2500);
        return n-maxXp;
      }
      return n;
    });
  };
  return{xp,level,points,streak,totalDone,addReward,showLevelUp,pct:Math.min((xp/maxXp)*100,100)};
}

// ── COMPONENTES DE GAMIFICAÇÃO ────────────────────────────────────────────

function LevelUpModal({show,level,color}){
  if(!show)return null;
  return(
    <div style={{position:"fixed",inset:0,zIndex:9998,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
      <div style={{background:`linear-gradient(135deg,${color}33,${color}11)`,border:`3px solid ${color}`,borderRadius:28,padding:"32px 40px",textAlign:"center",animation:"levelUp 2.5s ease forwards",backdropFilter:"blur(10px)"}}>
        <div style={{fontSize:52,marginBottom:8,animation:"spin 1s ease"}}>🏆</div>
        <div style={{fontSize:13,color,fontWeight:700,letterSpacing:2,marginBottom:4}}>NÍVEL ACIMA!</div>
        <div style={{fontSize:38,fontWeight:900,color,fontFamily:"'Space Grotesk',sans-serif"}}>Nível {level}</div>
        <div style={{fontSize:13,color:C.text,marginTop:8}}>Você está evoluindo! Continue! 🌟</div>
      </div>
    </div>
  );
}

function BoomEffect({on}){
  if(!on)return null;
  const particles=["🎉","⭐","✨","🌟","💥","🎊"];
  return(
    <div style={{position:"fixed",top:"38%",left:"50%",zIndex:9997,pointerEvents:"none"}}>
      {particles.map((p,i)=>(
        <div key={i} style={{
          position:"absolute",fontSize:28,
          "--dx":`${(Math.random()-0.5)*200}px`,
          "--dy":`${-Math.random()*180-60}px`,
          animation:`confetti ${0.6+Math.random()*0.4}s ease forwards`,
          animationDelay:`${i*0.04}s`
        }}>{p}</div>
      ))}
    </div>
  );
}

function GameTopBanner({level,xp,pct,points,streak,color,levelTitle,icon}){
  return(
    <div style={{margin:"0 20px 20px",background:`linear-gradient(135deg,${color}20,${color}08)`,border:`2px solid ${color}55`,borderRadius:22,padding:"16px 18px",boxShadow:`0 8px 32px ${color}18`}}>
      {/* Top row */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:46,height:46,borderRadius:14,background:`linear-gradient(135deg,${color},${color}bb)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,boxShadow:`0 4px 14px ${color}55`,flexShrink:0}}>
            {icon}
          </div>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
              <div style={{background:`linear-gradient(135deg,${color},${color}aa)`,borderRadius:99,padding:"2px 12px",fontSize:11,fontWeight:900,color:"#fff"}}>
                NÍVEL {level}
              </div>
            </div>
            <div style={{fontSize:14,fontWeight:800,color}}>{levelTitle}</div>
            <div style={{fontSize:10,color:C.muted,marginTop:1}}>{xp}/300 XP para o próximo nível</div>
          </div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:22,fontWeight:900,color,fontFamily:"'Space Grotesk',sans-serif"}}>{points}</div>
          <div style={{fontSize:10,color:C.muted}}>pontos totais</div>
          <div style={{fontSize:12,color:C.orange,fontWeight:700,marginTop:2}}>🔥 {streak} dias</div>
        </div>
      </div>
      {/* XP bar */}
      <div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.muted,marginBottom:5}}>
          <span>XP {xp}</span>
          <span>{Math.round(pct)}% do próximo nível</span>
        </div>
        <div style={{height:10,background:"rgba(255,255,255,0.08)",borderRadius:99,overflow:"hidden",position:"relative"}}>
          <div style={{width:`${pct}%`,height:"100%",borderRadius:99,background:`linear-gradient(90deg,${color},${color}cc)`,boxShadow:`0 0 10px ${color}80`,transition:"width 0.6s ease"}}/>
        </div>
      </div>
    </div>
  );
}

function MissionCard({m,color,onDone}){
  const [pressed,setPressed]=useState(false);
  const handle=()=>{
    if(m.done)return;
    setPressed(true);
    setTimeout(()=>setPressed(false),200);
    onDone(m.id);
  };
  return(
    <div onClick={handle} style={{
      display:"flex",alignItems:"center",gap:12,
      margin:"0 20px 10px",padding:"14px 16px",borderRadius:18,
      cursor:m.done?"default":"pointer",
      background:m.done?`${color}15`:"rgba(255,255,255,0.04)",
      border:`2px solid ${m.done?color+"66":"rgba(255,255,255,0.09)"}`,
      transition:"all 0.25s",
      transform:pressed?"scale(0.97)":"scale(1)",
      boxShadow:m.done?`0 4px 18px ${color}25`:"none"
    }}>
      <div style={{
        width:42,height:42,borderRadius:"50%",flexShrink:0,
        background:m.done?`linear-gradient(135deg,${color},${color}88)`:"rgba(255,255,255,0.08)",
        display:"flex",alignItems:"center",justifyContent:"center",
        fontSize:m.done?20:22,
        boxShadow:m.done?`0 0 14px ${color}55`:"none",
        transition:"all 0.3s",
        animation:m.done?"popIn 0.4s ease":""
      }}>
        {m.done?"✓":m.emoji}
      </div>
      <div style={{flex:1}}>
        <div style={{fontSize:13,fontWeight:700,color:m.done?C.muted:C.text,textDecoration:m.done?"line-through":"none",lineHeight:1.4}}>
          {m.text}
        </div>
        <div style={{display:"flex",gap:8,marginTop:4,alignItems:"center"}}>
          {!m.done&&<span style={{fontSize:10,color:C.muted}}>👆 toque para completar</span>}
          {m.done&&<span style={{fontSize:10,color,fontWeight:700}}>✓ Concluída!</span>}
        </div>
      </div>
      <div style={{textAlign:"right",flexShrink:0}}>
        <div style={{fontSize:12,fontWeight:800,color:m.done?C.muted:color}}>{m.done?"✓":`+${m.pts}pts`}</div>
        <div style={{fontSize:10,color:m.done?C.muted:C.purple,marginTop:1}}>{m.done?"":` +${m.xv}xp`}</div>
        {m.cat&&<div style={{fontSize:11,color:C.muted,marginTop:2,background:"rgba(255,255,255,0.06)",borderRadius:99,padding:"1px 6px"}}>{m.cat}</div>}
      </div>
    </div>
  );
}

function MissionsProgress({missions,color}){
  const done=missions.filter(m=>m.done).length;
  const total=missions.length;
  const pct=total>0?done/total:0;
  const r=24,circ=2*Math.PI*r;
  return(
    <div style={{margin:"0 20px 18px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:18,padding:"14px 18px",display:"flex",alignItems:"center",gap:18}}>
      <svg width="60" height="60" viewBox="0 0 60 60" style={{flexShrink:0}}>
        <circle cx="30" cy="30" r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="6"/>
        <circle cx="30" cy="30" r={r} fill="none" stroke={color} strokeWidth="6"
          strokeDasharray={`${pct*circ} ${circ}`} strokeLinecap="round"
          transform="rotate(-90 30 30)" style={{transition:"stroke-dasharray 0.5s ease"}}/>
        <text x="30" y="35" textAnchor="middle" fontSize="13" fontWeight="900" fill={color}>{done}/{total}</text>
      </svg>
      <div>
        <div style={{fontSize:15,fontWeight:800,marginBottom:3}}>
          {done===total&&total>0?"🎉 Todas completas!":done===0?"Comece as missões!":"Em progresso..."}
        </div>
        <div style={{fontSize:12,color:C.muted}}>{total-done} missões restantes hoje</div>
        <div style={{display:"flex",gap:4,marginTop:7}}>
          {missions.map(m=>(
            <div key={m.id} style={{width:10,height:10,borderRadius:"50%",background:m.done?color:"rgba(255,255,255,0.15)",transition:"all 0.3s",boxShadow:m.done?`0 0 6px ${color}`:""}}/>
          ))}
        </div>
      </div>
    </div>
  );
}

function BadgesSection({badges,color,title,points,level,streak}){
  return(
    <div style={{padding:"0 20px"}}>
      {/* Trophy card */}
      <div style={{background:`linear-gradient(135deg,${color}20,${color}08)`,border:`2px solid ${color}44`,borderRadius:22,padding:"22px",textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:42,marginBottom:8,animation:"float 2.5s ease infinite"}}>🏆</div>
        <div style={{fontSize:16,fontWeight:900,color,fontFamily:"'Space Grotesk',sans-serif",marginBottom:14}}>{title}</div>
        <div style={{display:"flex",justifyContent:"center",gap:0}}>
          {[
            {val:points,label:"Pontos",icon:"💎",col:color},
            {val:level,label:"Nível",icon:"⚡",col:C.gold},
            {val:streak,label:"Dias",icon:"🔥",col:C.orange},
          ].map((s,i)=>(
            <div key={i} style={{flex:1,textAlign:"center",borderRight:i<2?`1px solid rgba(255,255,255,0.08)`:"none",padding:"0 8px"}}>
              <div style={{fontSize:11,marginBottom:4}}>{s.icon}</div>
              <div style={{fontSize:22,fontWeight:900,color:s.col}}>{s.val}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2}}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>
      {/* Badges grid */}
      <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:2,marginBottom:14}}>CONQUISTAS</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
        {badges.map((b,i)=>(
          <div key={i} style={{
            background:b.on?`${b.c}22`:"rgba(255,255,255,0.03)",
            border:`2px solid ${b.on?b.c:"rgba(255,255,255,0.08)"}`,
            borderRadius:18,padding:"16px 8px",textAlign:"center",
            filter:b.on?"none":"grayscale(1) opacity(0.32)",
            boxShadow:b.on?`0 0 18px ${b.c}35`:"none",
            animation:b.on?`rise 0.4s ease ${i*0.07}s both`:""
          }}>
            <div style={{fontSize:30,animation:b.on?"float 3s ease infinite":"none",marginBottom:6}}>{b.on?b.e:"🔒"}</div>
            <div style={{fontSize:11,fontWeight:800,color:b.on?b.c:C.muted,lineHeight:1.3}}>{b.l}</div>
            {b.on&&<div style={{fontSize:10,color:C.muted,marginTop:3}}>Desbloqueado!</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── SPLASH ────────────────────────────────────────────────────────────────
function Splash({onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2500);return()=>clearTimeout(t);},[]);
  return(
    <div style={{position:"fixed",inset:0,background:C.navy,zIndex:9999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:24,animation:"fadeOut 0.5s ease 2.1s forwards"}}>
      <div style={{animation:"pulse 1.5s ease infinite",filter:"drop-shadow(0 0 24px rgba(0,201,177,0.5))"}}>
        <svg width="86" height="86" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="8" fill={C.teal}/>
          <ellipse cx="40" cy="40" rx="35" ry="14" stroke={C.teal} strokeWidth="2" fill="none" opacity="0.9"/>
          <ellipse cx="40" cy="40" rx="35" ry="14" stroke={C.blue} strokeWidth="1.5" fill="none" opacity="0.6" transform="rotate(60 40 40)"/>
          <ellipse cx="40" cy="40" rx="35" ry="14" stroke={C.purple} strokeWidth="1.5" fill="none" opacity="0.6" transform="rotate(120 40 40)"/>
        </svg>
      </div>
      <div style={{textAlign:"center",animation:"rise 0.6s ease 0.3s both"}}>
        <div style={{fontSize:46,fontWeight:900,fontFamily:"'Space Grotesk',sans-serif",letterSpacing:4,background:`linear-gradient(135deg,${C.teal},${C.blue})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>AXION</div>
        <div style={{fontSize:12,color:C.muted,letterSpacing:3,marginTop:6}}>RADIOTERAPIA HUMANIZADA</div>
      </div>
      <div style={{width:210,height:3,background:C.navyM,borderRadius:99,overflow:"hidden",animation:"rise 0.6s ease 0.5s both"}}>
        <div style={{height:"100%",background:`linear-gradient(90deg,${C.teal},${C.blue})`,borderRadius:99,animation:"barFill 1.8s ease 0.6s forwards",width:0}}/>
      </div>
    </div>
  );
}

// ── HOME ──────────────────────────────────────────────────────────────────
function Home({onNav,perfil}){
  const areas=[
    {id:"paciente",label:"Área Paciente",icon:"🧑",color:C.teal,desc:"Seu tratamento"},
    {id:"feminina",label:"Área Feminina",icon:"🌸",color:C.pink,desc:"Mama & acolhimento"},
    {id:"masculina",label:"Área Masculina",icon:"💙",color:C.blue,desc:"Próstata & bem-estar"},
    {id:"kids",label:"Área Kids",icon:"⭐",color:C.gold,desc:"Heróis do Raio do Bem"},
    {id:"profissional",label:"Área Profissional",icon:"🏥",color:C.purple,desc:"Painel clínico"},
    {id:"direitos",label:"Meus Direitos",icon:"⚖️",color:C.green,desc:"Direitos do paciente"},
    {id:"jogos",label:"Jogos & Diversão",icon:"🎮",color:C.gold,desc:"Para esperar brincando"},
    {id:"ia",label:"Assistente IA",icon:"🤖",color:C.teal,desc:"Tire dúvidas com IA"},

  const primeiroNome=perfil&&perfil.nome?perfil.nome.split(" ")[0]:"";

  return(
    <div style={{padding:"0 20px 100px"}}>
      <div style={{padding:"52px 0 24px",textAlign:"center",position:"relative"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:6}}>
          <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="3" fill={C.teal}/>
            <ellipse cx="14" cy="14" rx="12" ry="5" stroke={C.teal} strokeWidth="1.5" fill="none"/>
            <ellipse cx="14" cy="14" rx="12" ry="5" stroke={C.teal} strokeWidth="1.5" fill="none" transform="rotate(60 14 14)"/>
            <ellipse cx="14" cy="14" rx="12" ry="5" stroke={C.teal} strokeWidth="1.5" fill="none" transform="rotate(120 14 14)"/>
          </svg>
          <span style={{fontSize:26,fontWeight:900,fontFamily:"'Space Grotesk',sans-serif",letterSpacing:2,background:`linear-gradient(135deg,${C.teal},${C.blue})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>AXION</span>
        </div>
        <div style={{fontSize:11,color:C.muted,letterSpacing:2}}>RADIOTERAPIA HUMANIZADA</div>
      </div>
      <div style={{background:`linear-gradient(135deg,${C.navyL},${C.navyM})`,border:`1px solid ${C.teal}40`,borderRadius:22,padding:"18px 20px",marginBottom:18,boxShadow:"0 8px 32px rgba(0,201,177,0.1)"}}>
        <div style={{fontSize:11,color:C.teal,fontWeight:700,marginBottom:5}}>{saudacao}</div>
        <div style={{fontSize:17,fontWeight:800,marginBottom:5}}>{primeiroNome?`Olá, ${primeiroNome}!`:"Você não está sozinho"}</div>
        <div style={{fontSize:12,color:C.muted,lineHeight:1.7}}>O AXION apoia cada etapa do seu tratamento com cuidado, informação e gamificação!</div>
      </div>
      {perfil&&(
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.navyM}`,borderRadius:14,padding:"10px 14px",marginBottom:26}}>
          <div style={{fontSize:11,color:C.muted}}>Código: <strong style={{color:C.teal,letterSpacing:1}}>{perfil.codigo}</strong></div>
          <button onClick={()=>onNav("paciente")} style={{background:"none",border:"none",color:C.muted,fontSize:11,fontWeight:700,textDecoration:"underline"}}>gerenciar conta →</button>
        </div>
      )}
      <div style={{fontSize:10,color:C.muted,letterSpacing:2,fontWeight:700,marginBottom:14}}>SELECIONE SUA ÁREA</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        {areas.map((a,i)=>(
          <button key={a.id} onClick={()=>onNav(a.id)} style={{
            background:`${a.color}12`,border:`2px solid ${a.color}44`,
            borderRadius:20,padding:"18px 14px",textAlign:"left",
            animation:`rise 0.4s ease ${i*0.07}s both`,transition:"all 0.2s",
            boxShadow:`0 4px 18px ${a.color}15`
          }}>
            <div style={{fontSize:28,marginBottom:8}}>{a.icon}</div>
            <div style={{fontSize:12,fontWeight:800,color:a.color,marginBottom:2}}>{a.label}</div>
            <div style={{fontSize:10,color:C.muted}}>{a.desc}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ── GERADOR DE CÓDIGO ÚNICO ───────────────────────────────────────────────
function gerarCodigo(){
  const letras="ABCDEFGHJKLMNPQRSTUVWXYZ";
  const nums="0123456789";
  let c="AX-";
  for(let i=0;i<3;i++) c+=letras[Math.floor(Math.random()*letras.length)];
  c+="-";
  for(let i=0;i<4;i++) c+=nums[Math.floor(Math.random()*nums.length)];
  return c;
}

// ── TELA DE CADASTRO / LOGIN ───────────────────────────────────────────────
function TelaAcesso({onEntrar}){
  const [modo,setModo]=useState("inicio"); // inicio | cadastro | login
  const [form,setForm]=useState({nome:"",idade:"",sexo:"",tipo:"",medico:"",hospital:"",totalSessoes:"",sessaoAtual:""});
  const [codigoLogin,setCodigoLogin]=useState("");
  const [erroLogin,setErroLogin]=useState("");
  const [step,setStep]=useState(1);
  const [perfilCriado,setPerfilCriado]=useState(null);

  const iF=(k,v)=>setForm(f=>({...f,[k]:v}));

  // remove espaços, traços e deixa maiúsculo, para comparar códigos de forma tolerante
  const normalizarCodigo=(s)=>(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");

  const concluirCadastro=()=>{
    if(!form.nome||!form.tipo) return;
    try{
      const codigo=gerarCodigo();
      const perfil={...form,codigo,criadoEm:new Date().toLocaleDateString("pt-BR")};
      const todos=JSON.parse(localStorage.getItem("axion_pacientes")||"{}");
      todos[codigo]=perfil;
      localStorage.setItem("axion_pacientes",JSON.stringify(todos));
      setPerfilCriado(perfil);
    }catch(e){
      setErroLogin("Não foi possível salvar seu perfil neste navegador. Verifique se o armazenamento local (cookies/dados de site) não está bloqueado e tente novamente.");
    }
  };

  const fazerLogin=()=>{
    if(!codigoLogin.trim()){setErroLogin("Digite seu código para entrar.");return;}
    try{
      const todos=JSON.parse(localStorage.getItem("axion_pacientes")||"{}");
      const alvo=normalizarCodigo(codigoLogin);
      const chaveEncontrada=Object.keys(todos).find(k=>normalizarCodigo(k)===alvo);
      const p=chaveEncontrada?todos[chaveEncontrada]:null;
      if(p){onEntrar(p);setErroLogin("");}
      else setErroLogin("Código não encontrado neste aparelho. Confira se digitou certo (ex: AX-ABC-1234) ou toque em \"Esqueci meu código\".");
    }catch(e){
      setErroLogin("Não foi possível acessar o armazenamento local deste navegador. Tente em outro navegador ou verifique as configurações de privacidade.");
    }
  };

  if(perfilCriado) return <TelaCodigoGerado perfil={perfilCriado} onContinuar={()=>onEntrar(perfilCriado)}/>;

  const inputStyle={width:"100%",background:C.navyM,border:`1.5px solid ${C.navyM}`,borderRadius:12,padding:"12px 14px",color:C.text,fontSize:14,outline:"none",fontFamily:"'Nunito',sans-serif"};
  const labelStyle={fontSize:11,color:C.muted,fontWeight:700,marginBottom:5,display:"block",letterSpacing:1};

  if(modo==="inicio") return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 28px",gap:0}}>
      {/* Logo */}
      <div style={{textAlign:"center",marginBottom:36,animation:"rise 0.5s ease both"}}>
        <div style={{animation:"pulse 2s ease infinite",filter:"drop-shadow(0 0 24px rgba(0,201,177,0.5))",marginBottom:18}}>
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="8" fill={C.teal}/>
            <ellipse cx="40" cy="40" rx="35" ry="14" stroke={C.teal} strokeWidth="2" fill="none" opacity="0.9"/>
            <ellipse cx="40" cy="40" rx="35" ry="14" stroke={C.blue} strokeWidth="1.5" fill="none" opacity="0.6" transform="rotate(60 40 40)"/>
            <ellipse cx="40" cy="40" rx="35" ry="14" stroke={C.purple} strokeWidth="1.5" fill="none" opacity="0.6" transform="rotate(120 40 40)"/>
          </svg>
        </div>
        <div style={{fontSize:44,fontWeight:900,fontFamily:"'Space Grotesk',sans-serif",letterSpacing:4,background:`linear-gradient(135deg,${C.teal},${C.blue})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>AXION</div>
        <div style={{fontSize:12,color:C.muted,letterSpacing:3,marginTop:6}}>RADIOTERAPIA HUMANIZADA</div>
      </div>
      <div style={{background:C.navyL,border:`1px solid ${C.teal}30`,borderRadius:24,padding:"28px 24px",width:"100%",maxWidth:380,animation:"rise 0.5s ease 0.15s both"}}>
        <div style={{fontSize:16,fontWeight:800,textAlign:"center",marginBottom:6}}>Bem-vindo(a) 👋</div>
        <div style={{fontSize:12,color:C.muted,textAlign:"center",lineHeight:1.7,marginBottom:26}}>Crie seu perfil para uma experiência personalizada ou acesse com seu código único.</div>
        <button onClick={()=>setModo("cadastro")} style={{width:"100%",padding:"15px",borderRadius:14,border:"none",background:`linear-gradient(135deg,${C.teal},${C.blue})`,color:C.navy,fontWeight:800,fontSize:15,marginBottom:12}}>
          ✨ Criar meu perfil
        </button>

          🔑 Já tenho um código
        </button>
      </div>
    </div>
  );

  if(modo==="login") return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 28px"}}>
      <div style={{background:C.navyL,border:`1px solid ${C.teal}30`,borderRadius:24,padding:"28px 24px",width:"100%",maxWidth:380,animation:"rise 0.4s ease both"}}>
        <button onClick={()=>setModo("inicio")} style={{background:"none",border:"none",color:C.muted,fontSize:13,marginBottom:18,display:"flex",alignItems:"center",gap:6}}>← Voltar</button>
        <div style={{fontSize:22,fontWeight:900,marginBottom:6}}>🔑 Acessar minha conta</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:22,lineHeight:1.6}}>Digite o código único que você recebeu no cadastro.</div>
        <label style={labelStyle}>SEU CÓDIGO AXION</label>

        {erroLogin&&<div style={{color:C.pink,fontSize:12,marginTop:8,textAlign:"center"}}>{erroLogin}</div>}
        <button onClick={fazerLogin} style={{width:"100%",padding:"15px",borderRadius:14,border:"none",background:`linear-gradient(135deg,${C.teal},${C.blue})`,color:C.navy,fontWeight:800,fontSize:15,marginTop:20}}>

          Esqueci meu código

        {/* barra de progresso */}
        <div style={{height:5,background:C.navyM,borderRadius:99,overflow:"hidden"}}>

            </div>
            <div style={{marginBottom:18}}>
              <label style={labelStyle}>IDADE</label>

              <div style={{display:"flex",gap:10}}>
                {["Masculino","Feminino","Prefiro não informar"].map(s=>(
                  <button key={s} onClick={()=>iF("sexo",s)} style={{flex:1,padding:"11px 4px",borderRadius:12,border:`1.5px solid ${form.sexo===s?C.teal:C.navyM}`,background:form.sexo===s?`${C.teal}22`:"transparent",color:form.sexo===s?C.teal:C.muted,fontWeight:700,fontSize:10}}>

            <button onClick={()=>{if(form.nome)setStep(2);}} style={{width:"100%",padding:"15px",borderRadius:14,border:"none",background:form.nome?`linear-gradient(135deg,${C.teal},${C.blue})`:"rgba(255,255,255,0.1)",color:form.nome?C.navy:C.muted,fontWeight:800,fontSize:15,marginTop:10}}>
              Continuar →
            </button>
          </div>
        )}

        {step===2&&(
          <div style={{animation:"rise 0.35s ease both"}}>
            <div style={{marginBottom:18}}>
              <label style={labelStyle}>TIPO DE TRATAMENTO *</label>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {["Mama","Próstata","Pulmão","Colo do Útero","Cabeça e Pescoço","Outro"].map(t=>(

              <div style={{fontSize:13,fontWeight:900,color:C.teal,marginBottom:14}}>✅ Confirme seus dados</div>

  );

// ── TELA DE RECUPERAÇÃO DE CÓDIGO ─────────────────────────────────────────
function TelaRecuperarCodigo({onVoltar,onEntrar}){
  const [busca,setBusca]=useState("");
  const [buscou,setBuscou]=useState(false);
  const [resultados,setResultados]=useState([]);

  const inputStyle={width:"100%",background:C.navyM,border:`1.5px solid ${C.navyM}`,borderRadius:12,padding:"12px 14px",color:C.text,fontSize:14,outline:"none",fontFamily:"'Nunito',sans-serif"};
  const labelStyle={fontSize:11,color:C.muted,fontWeight:700,marginBottom:5,display:"block",letterSpacing:1};

  const buscar=()=>{
    const termo=busca.trim().toLowerCase();
    setBuscou(true);
    if(!termo){setResultados([]);return;}
    try{
      const todos=JSON.parse(localStorage.getItem("axion_pacientes")||"{}");
      const achados=Object.values(todos).filter(p=>p.nome&&p.nome.toLowerCase().includes(termo));
      setResultados(achados);
    }catch(e){
      setResultados([]);
    }
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 28px"}}>
      <div style={{background:C.navyL,border:`1px solid ${C.teal}30`,borderRadius:24,padding:"28px 24px",width:"100%",maxWidth:380,animation:"rise 0.4s ease both"}}>
        <button onClick={onVoltar} style={{background:"none",border:"none",color:C.muted,fontSize:13,marginBottom:18,display:"flex",alignItems:"center",gap:6}}>← Voltar</button>
        <div style={{fontSize:22,fontWeight:900,marginBottom:6}}>🔍 Recuperar acesso</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:20,lineHeight:1.7}}>Digite o nome usado no cadastro. Vamos procurar seu perfil <strong style={{color:C.text}}>neste mesmo aparelho</strong> onde ele foi criado.</div>
        <label style={labelStyle}>NOME COMPLETO (OU PARTE DELE)</label>
        <input value={busca} onChange={e=>setBusca(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")buscar();}} placeholder="Ex: Maria Silva" autoFocus style={inputStyle}/>
        <button onClick={buscar} style={{width:"100%",padding:"14px",borderRadius:14,border:"none",background:`linear-gradient(135deg,${C.teal},${C.blue})`,color:C.navy,fontWeight:800,fontSize:14,marginTop:16}}>
          Buscar perfil
        </button>

        {buscou&&resultados.length===0&&(
          <div style={{background:`${C.pink}15`,border:`1.5px solid ${C.pink}55`,borderRadius:14,padding:"14px",marginTop:18}}>
            <div style={{fontSize:12,color:C.text,fontWeight:700,marginBottom:6}}>Nenhum perfil encontrado neste aparelho.</div>
            <div style={{fontSize:11,color:C.muted,lineHeight:1.7}}>Isso pode acontecer se o cadastro foi feito em outro celular/computador, ou se os dados do navegador foram apagados. Se for o caso, você pode criar um novo perfil — seu histórico de missões não será perdido no aparelho original.</div>
          </div>
        )}

        {resultados.length>0&&(
          <div style={{marginTop:20}}>
            <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:10}}>{resultados.length} PERFIL(S) ENCONTRADO(S)</div>
            {resultados.map((p,i)=>(
              <div key={i} style={{background:"rgba(255,255,255,0.05)",border:`1.5px solid ${C.navyM}`,borderRadius:14,padding:"14px",marginBottom:10}}>
                <div style={{fontSize:14,fontWeight:800,marginBottom:2}}>{p.nome}</div>
                <div style={{fontSize:11,color:C.muted,marginBottom:8}}>{p.tipo||"—"}{p.hospital?` · ${p.hospital}`:""}</div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                  <div style={{fontSize:13,fontWeight:900,color:C.teal,letterSpacing:1}}>{p.codigo}</div>
                  <button onClick={()=>onEntrar(p)} style={{background:`${C.teal}22`,border:`1px solid ${C.teal}66`,borderRadius:10,padding:"7px 16px",color:C.teal,fontSize:12,fontWeight:800}}>Entrar →</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── TELA DO CÓDIGO GERADO ─────────────────────────────────────────────────
function TelaCodigoGerado({perfil,onContinuar}){
  const [copiado,setCopiado]=useState(false);
  const copiar=()=>{
    navigator.clipboard&&navigator.clipboard.writeText(perfil.codigo);
    setCopiado(true);setTimeout(()=>setCopiado(false),2000);
  };
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 28px"}}>
      <div style={{background:C.navyL,border:`2px solid ${C.teal}55`,borderRadius:24,padding:"32px 24px",width:"100%",maxWidth:380,textAlign:"center",animation:"rise 0.5s ease both"}}>
        <div style={{fontSize:52,marginBottom:12,animation:"float 2s ease infinite"}}>🎉</div>
        <div style={{fontSize:20,fontWeight:900,marginBottom:6}}>Perfil criado, {perfil.nome.split(" ")[0]}!</div>
        <div style={{fontSize:12,color:C.muted,lineHeight:1.7,marginBottom:24}}>Seu código único AXION está pronto. <strong style={{color:C.text}}>Anote-o agora</strong> — você precisará dele para entrar novamente.</div>

        {/* Código */}
        <div style={{background:`${C.teal}18`,border:`2px solid ${C.teal}`,borderRadius:18,padding:"20px",marginBottom:20}}>
          <div style={{fontSize:11,color:C.teal,fontWeight:700,letterSpacing:2,marginBottom:8}}>SEU CÓDIGO AXION</div>
          <div style={{fontSize:30,fontWeight:900,letterSpacing:4,fontFamily:"'Space Grotesk',sans-serif",color:C.teal,marginBottom:12}}>{perfil.codigo}</div>
          <button onClick={copiar} style={{background:copiado?`${C.teal}33`:"transparent",border:`1px solid ${C.teal}66`,borderRadius:99,padding:"7px 20px",color:C.teal,fontSize:12,fontWeight:700}}>
            {copiado?"✓ Copiado!":"📋 Copiar código"}

        </div>

        <div style={{background:"rgba(255,209,102,0.1)",border:"1px solid rgba(255,209,102,0.4)",borderRadius:12,padding:"12px",marginBottom:22,fontSize:11,color:"#ffd166",lineHeight:1.6}}>
          💡 Dica: tire uma foto deste código ou anote num papel para não perder.
        </div>

        <button onClick={onContinuar} style={{width:"100%",padding:"15px",borderRadius:14,border:"none",background:`linear-gradient(135deg,${C.teal},${C.blue})`,color:C.navy,fontWeight:800,fontSize:15}}>
          Entrar no AXION →
        </button>
      </div>
    </div>
  );
}

      dica:"Prefira alimentos de cheiro suave e textura macia. Coma pequenas quantidades várias vezes ao dia.",
      color:C.gold
    },
    ansiedade:{
      label:"Ansiedade",emoji:"💭",
      desc:"Sensação de preocupação, medo ou tensão relacionada ao tratamento ou ao diagnóstico.",
      dica:"Respire fundo, pratique meditação guiada. Converse com psicólogo ou com pessoas de confiança.",
      color:C.blue
    },
    sono:{
      label:"Dificuldade de Sono",emoji:"🌙",
      desc:"Insônia ou sono não reparador, frequente durante o tratamento oncológico por estresse ou efeitos colaterais.",
      dica:"Mantenha horários regulares de sono. Evite telas antes de dormir. Técnicas de relaxamento ajudam muito.",
      color:C.teal
    },
  };

  const [openLib,setOpenLib]=useState(null);
  const library=[
    // ── Sobre a radioterapia ──
    {cat:"Sobre a radioterapia",icon:"📡",title:"O que é radioterapia?",time:"3 min",
     content:"A radioterapia usa raios de alta energia para destruir células cancerígenas. Durante o tratamento, você deita numa maca enquanto um equipamento direciona os raios para a área afetada. O procedimento é indolor e dura poucos minutos. A equipe médica fica do lado de fora por segurança, mas monitora tudo o tempo todo."},
    {cat:"Sobre a radioterapia",icon:"📋",title:"Efeitos colaterais comuns",time:"5 min",
     content:"Os efeitos colaterais mais comuns incluem: fadiga (cansaço), vermelhidão e sensibilidade na pele tratada, queda de cabelo na área irradiada e náusea (em tratamentos abdominais). Esses efeitos são temporários e tendem a melhorar após o fim do tratamento. Comunique sempre sua equipe sobre qualquer sintoma."},
    {cat:"Sobre a radioterapia",icon:"🧴",title:"Cuidados com a pele irradiada",time:"4 min",
     content:"A pele na área tratada pode ficar sensível e avermelhada. Cuide-a assim: use cremes hidratantes sem perfume indicados pelo médico, evite exposição solar direta, use roupas macias e soltas, não esfregue nem coce a área, evite piscina e banhos muito quentes. Informe a equipe caso apareçam bolhas ou feridas."},
    {cat:"Sobre a radioterapia",icon:"🥗",title:"Alimentação durante o tratamento",time:"6 min",
     content:"Uma boa alimentação fortalece o organismo: prefira frutas, legumes, verduras e proteínas magras como frango e peixe. Beba bastante água (pelo menos 8 copos por dia). Evite alimentos gordurosos, frituras e bebidas alcoólicas. Se sentir enjoo, coma em pequenas porções várias vezes ao dia. Em caso de dificuldade para se alimentar, consulte um nutricionista."},
    {cat:"Sobre a radioterapia",icon:"🚶",title:"Exercícios e movimento",time:"4 min",
     content:"Manter-se ativo ajuda a reduzir a fadiga e melhora o bem-estar. Caminhadas leves de 15 a 30 minutos por dia são recomendadas. Alongamentos suaves também ajudam. Evite exercícios intensos nos dias logo após as sessões se estiver muito cansado. Sempre converse com seu médico antes de iniciar ou intensificar qualquer atividade física."},

    // ── Tipos de câncer ──
    {cat:"Tipos de câncer",icon:"🎗️",title:"Câncer de Mama",time:"5 min",
     content:"É o crescimento desordenado de células na mama, formando um tumor. Pode ser detectado por nódulos, alterações na pele ou mamilo, sendo o autoexame e a mamografia importantes para diagnóstico precoce. O tratamento pode envolver cirurgia, radioterapia, quimioterapia e/ou terapia hormonal, combinados conforme o estágio e o tipo do tumor. Quanto antes descoberto, maiores as chances de sucesso do tratamento."},
    {cat:"Tipos de câncer",icon:"🔵",title:"Câncer de Próstata",time:"5 min",
     content:"Ocorre no crescimento anormal de células da próstata, glândula do sistema reprodutor masculino. É um dos cânceres mais comuns em homens, geralmente de crescimento lento. Pode ser identificado por exame de PSA e toque retal. O tratamento varia entre vigilância ativa, cirurgia, radioterapia e/ou bloqueio hormonal, dependendo do risco e da idade do paciente."},
    {cat:"Tipos de câncer",icon:"🫁",title:"Câncer de Pulmão",time:"5 min",
     content:"Surge do crescimento anormal de células no tecido pulmonar, fortemente associado ao tabagismo, mas também pode ocorrer em não fumantes. Sintomas incluem tosse persistente, falta de ar e dor no peito. O diagnóstico é feito por exames de imagem e biópsia. O tratamento pode incluir cirurgia, radioterapia, quimioterapia e terapias-alvo, conforme o tipo e estágio."},
    {cat:"Tipos de câncer",icon:"🌸",title:"Câncer do Colo do Útero",time:"5 min",
     content:"Afeta a parte inferior do útero e está fortemente ligado à infecção pelo HPV. A vacina contra o HPV e o exame preventivo (Papanicolau) são as principais formas de prevenção e detecção precoce. O tratamento pode envolver cirurgia, radioterapia externa e braquiterapia (radioterapia interna), a depender do estágio da doença."},
    {cat:"Tipos de câncer",icon:"👄",title:"Câncer de Cabeça e Pescoço",time:"5 min",
     content:"Engloba tumores na boca, garganta, laringe, glândulas salivares e seios da face. Está associado ao tabagismo, álcool e, em alguns casos, ao HPV. Pode causar rouquidão, dificuldade para engolir ou feridas que não cicatrizam. O tratamento costuma combinar cirurgia, radioterapia e quimioterapia, e pode afetar temporariamente a fala e a alimentação."},
    {cat:"Tipos de câncer",icon:"🌀",title:"Câncer de Intestino (Colorretal)",time:"5 min",
     content:"Se desenvolve no cólon ou reto, muitas vezes a partir de pólipos benignos que evoluem com o tempo. Fatores de risco incluem idade, histórico familiar e hábitos alimentares. A colonoscopia é essencial para diagnóstico e prevenção. O tratamento pode incluir cirurgia, radioterapia (especialmente no reto), quimioterapia, isolados ou combinados."},

    // ── Depois do tratamento ──
    {cat:"Depois do tratamento",icon:"🌱",title:"Primeiras semanas após o fim",time:"5 min",
     content:"É normal que efeitos como cansaço, sensibilidade na pele e alterações no paladar continuem por algumas semanas após a última sessão — o corpo continua se recuperando mesmo depois do tratamento terminar. Continue os cuidados com a pele e a alimentação leve nesse período. Descanse bastante, mas tente manter pequenas atividades do dia a dia para ajudar na recuperação gradual."},
    {cat:"Depois do tratamento",icon:"📅",title:"Consultas de acompanhamento",time:"4 min",
     content:"Após o tratamento, o acompanhamento médico regular é essencial. As consultas de retorno costumam ser mais frequentes nos primeiros anos e podem incluir exames de imagem e de sangue para monitorar a resposta ao tratamento. Não falte às consultas, mesmo se sentir-se bem — elas ajudam a identificar qualquer alteração precocemente."},
    {cat:"Depois do tratamento",icon:"🚨",title:"Sinais de alerta: quando procurar o médico",time:"4 min",
     content:"Procure sua equipe médica se notar: febre persistente, dor nova ou que piora, sangramentos incomuns, feridas que não cicatrizam, inchaço, perda de peso sem explicação ou qualquer sintoma que te preocupe. Na dúvida, é sempre melhor perguntar do que esperar — não existe pergunta boba quando se trata da sua saúde."},
    {cat:"Depois do tratamento",icon:"🔄",title:"Retomando a rotina",time:"5 min",
     content:"Voltar ao trabalho, aos estudos ou às atividades sociais pode ser feito aos poucos, respeitando seu ritmo. Converse com seu médico sobre quando é seguro retomar exercícios mais intensos, dirigir ou viajar. Muitas pessoas retomam a rotina gradualmente, e é normal precisar de mais pausas no início. Seja gentil consigo mesmo(a) nesse processo."},
    {cat:"Depois do tratamento",icon:"💛",title:"Saúde emocional após o tratamento",time:"5 min",
     content:"É comum sentir uma mistura de alívio e insegurança quando o tratamento termina — o chamado 'medo da recidiva' é bastante frequente. Manter contato com grupos de apoio, familiares e, se necessário, acompanhamento psicológico ajuda muito nessa fase. Comemore o fim do tratamento, mas sem pressa de 'voltar ao normal' — cada pessoa tem seu próprio tempo de readaptação."},
    {cat:"Depois do tratamento",icon:"🩺",title:"Hábitos que ajudam na recuperação",time:"4 min",
     content:"Alimentação equilibrada, atividade física regular (conforme orientação médica), sono de qualidade e evitar tabaco e álcool são hábitos que favorecem a recuperação e reduzem riscos futuros. Pequenas mudanças sustentáveis no dia a dia fazem mais diferença a longo prazo do que grandes mudanças temporárias."},
  ];
  const libCats=[...new Set(library.map(l=>l.cat))];

  return(
    <div style={{paddingBottom:100}}>
      {/* Header personalizado */}
      <div style={{background:`linear-gradient(135deg,${C.navyL},${C.navyM})`,padding:"48px 20px 20px",borderBottom:`1px solid ${C.navyM}`}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}>
          <BackBtn onBack={onBack}/>
          <div>
            <div style={{fontSize:11,color:C.teal,fontWeight:700,letterSpacing:1}}>OLÁ,</div>
            <div style={{fontSize:20,fontWeight:900,fontFamily:"'Space Grotesk',sans-serif"}}>{perfil.nome.split(" ")[0]} 👋</div>
          </div>
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
            <div style={{background:`${C.teal}18`,border:`1px solid ${C.teal}44`,borderRadius:12,padding:"6px 12px",textAlign:"center"}}>
              <div style={{fontSize:11,color:C.teal,fontWeight:700,letterSpacing:1}}>CÓDIGO</div>
              <div style={{fontSize:11,fontWeight:900,color:C.teal,letterSpacing:1}}>{perfil.codigo}</div>
            </div>
            {onSair&&(
              <button onClick={()=>setConfirmSair(true)} title="Sair da conta" style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${C.navyM}`,borderRadius:12,width:36,height:36,color:C.muted,fontSize:15,flexShrink:0}}>🚪</button>
            )}
          </div>
        </div>
        {confirmSair&&(
          <div style={{background:"rgba(255,107,157,0.12)",border:`1.5px solid ${C.pink}66`,borderRadius:14,padding:"12px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:C.text,flex:1}}>Sair desta conta neste dispositivo?</span>
            <button onClick={()=>setConfirmSair(false)} style={{background:"transparent",border:`1px solid ${C.navyM}`,borderRadius:10,padding:"6px 12px",color:C.muted,fontSize:11,fontWeight:700}}>Cancelar</button>
            <button onClick={onSair} style={{background:C.pink,border:"none",borderRadius:10,padding:"6px 12px",color:"#1a1a1a",fontSize:11,fontWeight:800}}>Sair</button>
          </div>
        )}
        {/* Mini progresso */}
        <div style={{background:"rgba(255,255,255,0.06)",borderRadius:14,padding:"12px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:11,color:C.muted}}>{perfil.tipo} — {perfil.hospital||"Hospital"}</span>
            <span style={{fontSize:12,fontWeight:800,color:C.teal}}>{sessaoAtual}/{totalSessoes} sessões</span>
          </div>
          <div style={{height:6,background:C.navyM,borderRadius:99,overflow:"hidden"}}>
            <div style={{width:`${progPct}%`,height:"100%",background:`linear-gradient(90deg,${C.teal},${C.blue})`,borderRadius:99}}/>
          </div>
          <div style={{fontSize:10,color:C.muted,marginTop:4}}>{progPct}% concluído</div>
        </div>
      </div>

      <TabBar tabs={["perfil","timeline","sintomas","biblioteca"]} labels={["Perfil","Tratamento","Sintomas","Biblioteca"]} active={tab} onChange={setTab} color={C.teal}/>

      {/* PERFIL */}
      {tab==="perfil"&&(
        <div style={{padding:"0 20px"}}>
          <div style={{background:C.navyL,borderRadius:20,padding:"20px",marginBottom:14,border:`1px solid ${C.teal}30`}}>
            <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:18}}>
              <div style={{width:56,height:56,borderRadius:"50%",background:`linear-gradient(135deg,${C.teal},${C.blue})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>
                {perfil.sexo==="Feminino"?"🌸":perfil.sexo==="Masculino"?"💙":"🧑"}
              </div>
              <div>
                <div style={{fontSize:17,fontWeight:900}}>{perfil.nome}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>{perfil.idade?" "+perfil.idade+" anos •":""} {perfil.tipo}</div>
                <div style={{fontSize:10,color:C.teal,marginTop:3}}>Paciente desde {perfil.criadoEm}</div>
              </div>
            </div>
            {[
              ["👨‍⚕️ Médico responsável",perfil.medico||"Não informado"],
              ["🏥 Hospital / Clínica",perfil.hospital||"Não informado"],
              ["⚡ Tipo de radioterapia",perfil.tipo],
              ["📅 Progresso",`${sessaoAtual} de ${totalSessoes} sessões (${progPct}%)`],
            ].map(([l,v])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:12,marginBottom:12,borderBottom:`1px solid rgba(255,255,255,0.06)`}}>
                <span style={{fontSize:12,color:C.muted}}>{l}</span>
                <span style={{fontSize:12,fontWeight:700,maxWidth:160,textAlign:"right"}}>{v}</span>
              </div>
            ))}
          </div>
          {/* Código de acesso */}
          <div style={{background:`${C.gold}12`,border:`1.5px solid ${C.gold}44`,borderRadius:16,padding:"16px",textAlign:"center"}}>
            <div style={{fontSize:11,color:C.gold,fontWeight:700,letterSpacing:2,marginBottom:6}}>🔑 SEU CÓDIGO DE ACESSO</div>
            <div style={{fontSize:24,fontWeight:900,letterSpacing:4,color:C.gold,fontFamily:"'Space Grotesk',sans-serif"}}>{perfil.codigo}</div>
            <div style={{fontSize:10,color:C.muted,marginTop:6}}>Use este código para entrar no AXION em qualquer dispositivo</div>
          </div>
        </div>
      )}

      {/* TIMELINE */}
      {tab==="timeline"&&(
        <div style={{padding:"0 20px"}}>
          <div style={{background:C.navyL,borderRadius:18,padding:"16px",marginBottom:18,border:`1px solid ${C.teal}30`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:11,color:C.muted}}>Progresso do tratamento</div>
                <div style={{fontSize:24,fontWeight:900,color:C.teal}}>{sessaoAtual}<span style={{fontSize:13,fontWeight:400,color:C.muted}}> / {totalSessoes} sessões</span></div>
              </div>
              <div style={{width:56,height:56,borderRadius:"50%",border:`3px solid ${C.teal}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,color:C.teal,background:`${C.teal}15`}}>{progPct}%</div>
            </div>
            <div style={{marginTop:12,height:8,background:C.navyM,borderRadius:99,overflow:"hidden"}}>
              <div style={{width:`${progPct}%`,height:"100%",background:`linear-gradient(90deg,${C.teal},${C.blue})`,borderRadius:99}}/>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6}}>
            {sessions.slice(0,Math.min(totalSessoes,30)).map(s=>(
              <div key={s.n} style={{background:s.done?C.teal:s.active?`${C.teal}18`:C.navyL,border:s.active?`2px solid ${C.teal}`:"none",borderRadius:10,padding:"8px 4px",textAlign:"center",boxShadow:s.active?`0 0 10px ${C.teal}55`:"none"}}>
                <div style={{fontSize:10,fontWeight:800,color:s.done?C.navy:s.active?C.teal:C.muted}}>{s.n}ª</div>
                {s.done&&<div style={{fontSize:11,color:C.navy}}>✓</div>}
                {s.active&&<div style={{fontSize:10,color:C.teal,fontWeight:700}}>HOJE</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* SINTOMAS COM DESCRIÇÃO */}
      {tab==="sintomas"&&(
        <div style={{padding:"0 20px"}}>
          <div style={{background:`${C.teal}12`,border:`1px solid ${C.teal}30`,borderRadius:14,padding:"12px 14px",marginBottom:18,fontSize:12,color:C.muted,lineHeight:1.7}}>
            📊 Registre como você está hoje. Sua equipe de saúde acompanha esses dados para cuidar melhor de você.
          </div>
          {Object.entries(symInfo).map(([k,info])=>(
            <div key={k} style={{background:C.navyL,borderRadius:16,padding:"16px",marginBottom:12,border:`1.5px solid ${expandSym===k?info.color+"66":C.navyM}`,transition:"all 0.2s"}}>
              {/* Header do sintoma */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:20}}>{info.emoji}</span>
                  <div>
                    <div style={{fontSize:13,fontWeight:800}}>{info.label}</div>
                    <div style={{fontSize:10,color:C.muted,marginTop:1,cursor:"pointer"}} onClick={()=>setExpandSym(expandSym===k?null:k)}>
                      {expandSym===k?"▲ ocultar":"▼ o que é isso?"}
                    </div>
                  </div>
                </div>
                <div style={{background:`${info.color}22`,borderRadius:99,padding:"4px 12px",fontSize:13,fontWeight:900,color:info.color}}>
                  {syms[k]}/10
                </div>
              </div>
              {/* Descrição expandível */}
              {expandSym===k&&(
                <div style={{background:`${info.color}10`,border:`1px solid ${info.color}33`,borderRadius:12,padding:"12px 14px",marginBottom:12,animation:"rise 0.25s ease"}}>
                  <div style={{fontSize:12,color:C.text,lineHeight:1.7,marginBottom:8}}>
                    <strong style={{color:info.color}}>O que é:</strong> {info.desc}
                  </div>
                  <div style={{fontSize:11,color:C.muted,lineHeight:1.6}}>
                    <strong style={{color:info.color}}>💡 Dica:</strong> {info.dica}
                  </div>
                </div>
              )}
              {/* Slider */}
              <input type="range" min="0" max="10" value={syms[k]}
                onChange={e=>{setSyms(s=>({...s,[k]:+e.target.value}));setSaved(false);}}
                style={{accentColor:info.color}}/>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.muted,marginTop:4}}>
                <span>Nenhum</span><span>Leve</span><span>Moderado</span><span>Intenso</span>
              </div>
            </div>
          ))}
          <button onClick={()=>setSaved(true)} style={{width:"100%",padding:"14px",borderRadius:14,border:saved?`1px solid ${C.teal}`:"none",background:saved?`${C.teal}18`:`linear-gradient(135deg,${C.teal},${C.blue})`,color:saved?C.teal:C.navy,fontWeight:800,fontSize:14,marginBottom:8}}>
            {saved?"✓ Registrado com sucesso!":"Registrar Sintomas de Hoje"}
          </button>
          {saved&&<div style={{fontSize:11,color:C.muted,textAlign:"center",lineHeight:1.6}}>Seus sintomas foram salvos. Sua equipe de saúde poderá visualizá-los no painel profissional.</div>}
        </div>
      )}

      {/* BIBLIOTECA */}
      {tab==="biblioteca"&&(
        <div style={{padding:"0 20px"}}>
          <div style={{background:`${C.blue}12`,border:`1px solid ${C.blue}44`,borderRadius:14,padding:"12px 14px",marginBottom:16,fontSize:11,color:C.muted,lineHeight:1.6}}>
            ℹ️ Conteúdo educativo e geral. Cada caso é único — converse sempre com sua equipe médica sobre sua situação específica.
          </div>
          {libCats.map(cat=>(
            <div key={cat} style={{marginBottom:18}}>
              <div style={{fontSize:11,color:C.teal,fontWeight:800,letterSpacing:1.5,marginBottom:10}}>{cat.toUpperCase()}</div>
              {library.filter(item=>item.cat===cat).map((item,i)=>{
                const key=`${cat}-${i}`;
                return(
                  <div key={key} onClick={()=>setOpenLib(openLib===key?null:key)}
                    style={{background:openLib===key?`${C.teal}12`:C.navyL,borderRadius:16,marginBottom:10,border:`1.5px solid ${openLib===key?C.teal:C.navyM}`,overflow:"hidden",cursor:"pointer",transition:"all 0.25s"}}>
                    <div style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px"}}>
                      <div style={{width:42,height:42,borderRadius:12,background:openLib===key?`${C.teal}22`:"rgba(255,255,255,0.06)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,transition:"all 0.2s"}}>{item.icon}</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:700,color:openLib===key?C.teal:C.text}}>{item.title}</div>
                        <div style={{fontSize:10,color:C.muted,marginTop:2}}>⏱ {item.time} de leitura</div>
                      </div>
                      <div style={{color:C.teal,fontSize:18,transform:openLib===key?"rotate(90deg)":"",transition:"transform 0.25s"}}>›</div>
                    </div>
                    {openLib===key&&(
                      <div style={{padding:"0 16px 16px",animation:"rise 0.3s ease"}}>
                        <div style={{height:1,background:`${C.teal}30`,marginBottom:12}}/>
                        <div style={{fontSize:13,color:C.muted,lineHeight:1.8}}>{item.content}</div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  const boca=expressao==="feliz"?"M-14,8 Q0,20 14,8":expressao==="susto"?"M-8,8 Q0,18 8,8 Q0,28 -8,8":"M-10,10 Q0,7 10,10";
  const sb1=expressao==="susto"?"M-16,-54 L-8,-50":"M-16,-54 Q-12,-59 -8,-54";
  const sb2=expressao==="susto"?"M8,-50 L16,-54":"M8,-54 Q12,-59 16,-54";
  return(
    <svg width={s} height={s} viewBox="-55 -85 110 165">
      <path d="M-26,22 Q-36,58 -30,88 Q0,68 30,88 Q36,58 26,22 Z" fill="#ff9f43" stroke="#c86000" strokeWidth="1.5"/>
      <path d="M-26,22 Q-16,48 0,38 Q16,48 26,22 Z" fill="#ffd166"/>
      <rect x="-24" y="2" width="48" height="62" rx="11" fill="#ffd166" stroke="#c89000" strokeWidth="1.5"/>
      <polygon points="0,-6 -7,8 -2,8 -7,22 7,6 2,6 7,-6" fill="#ff5500" stroke="#aa2200" strokeWidth="0.5" transform="translate(0,26)"/>

        {tipo:"dica",txt:"💡 Dica da Estrela:",sub:"Pensa em algo ou alguém que te faz feliz durante a sessão!",emoji:"💡",bg:"linear-gradient(160deg,#100025,#080015)"},
      ]
    },
    {
      id:"doutor",nome:"Dr. Átomo",emoji:"🔬",cor:"#00c9b1",desc:"O cientista mais louco!",
      cenas:[
        {tipo:"fala",txt:"OIOI! Sou o DR. ÁTOMO! 🔬",sub:"O cientista mais maluco e mais legal do universo!",emoji:"🔬",bg:"linear-gradient(160deg,#001a15,#000d0a)"},
        {tipo:"fala",txt:"Vou te explicar a radioterapia...",sub:"...de um jeito que NENHUM adulto explica!",emoji:"🤫",bg:"linear-gradient(160deg,#001510,#000d08)"},
        {tipo:"acao",txt:"Imagina um videogame! 🎮",sub:"No seu corpo: VILÕES = células ruins / HERÓIS = células boas!",emoji:"🎮",bg:"linear-gradient(160deg,#001a15,#000d0a)"},
        {tipo:"destaque",txt:"A máquina é um CANHÃO LASER! 🚀",sub:"Um canhão que acerta SÓ os vilões!",emoji:"🚀",bg:"linear-gradient(160deg,#001515,#000a0a)"},
        {tipo:"fala",txt:"Os médicos treinaram ANOS pra mirar! 🎯",sub:"São os melhores atiradores do universo!",emoji:"🎯",bg:"linear-gradient(160deg,#001a15,#000d0a)"},
        {tipo:"acao",txt:"Você fica bem quietinho...",sub:"...pra o canhão mirar certinho nos vilões!",emoji:"🤫",bg:"linear-gradient(160deg,#001510,#000d08)"},
        {tipo:"destaque",txt:"PEW PEW! Os vilões vão embora! 💥",sub:"E seu corpo fica mais forte a cada sessão!",emoji:"💥",bg:"linear-gradient(160deg,#001a15,#000d0a)"},
        {tipo:"dica",txt:"💡 Dica do Dr. Átomo:",sub:"Faz perguntas pro médico! Eles ADORAM explicar!",emoji:"🔬",bg:"linear-gradient(160deg,#001515,#000a0a)"},
      ]
    },
  ];

  const addXp=(s,x)=>{
    setStars(v=>v+s);
    setXp(v=>{const n=v+x;if(n>=100){setLevel(l=>l+1);setShowLvl(true);setTimeout(()=>setShowLvl(false),2800);return n-100;}return n;});
  };
  const doneMission=id=>{
    const m=missions.find(x=>x.id===id);
    if(!m||m.done)return;
    setMissions(p=>p.map(x=>x.id===id?{...x,done:true}:x));
    addXp(m.s,m.xv);
    setBoom(true);setTimeout(()=>setBoom(false),1000);
  };
  const answerQ=i=>{
    setQAns(i);
    if(i===quizzes[qIdx].c){addXp(5,30);setBoom(true);setTimeout(()=>setBoom(false),900);}
  };
  useEffect(()=>{
    if(!heroSel||tela!=="historia")return;
    const c=heroSel.cenas[cena];
    if(!c)return;
    setTextoVis("");setDigitando(true);
    let i=0;clearInterval(timerRef.current);
    timerRef.current=setInterval(()=>{
      i++;setTextoVis(c.txt.slice(0,i));
      if(i>=c.txt.length){clearInterval(timerRef.current);setDigitando(false);}
    },42);
    return()=>clearInterval(timerRef.current);
  },[cena,heroSel,tela]);

  const avancar=()=>{
    if(digitando){clearInterval(timerRef.current);setTextoVis(heroSel.cenas[cena].txt);setDigitando(false);return;}
    if(cena<heroSel.cenas.length-1){setCena(c=>c+1);}
    else{addXp(8,40);setBoom(true);setTimeout(()=>setBoom(false),1200);setTela("mapa");setHeroSel(null);setCena(0);}
  };

  const entrar=(h)=>{setHeroSel(h);setCena(0);setTextoVis("");setTela("historia");};
  const xpPct=Math.min((xp/100)*100,100);
  const lvlNames=["Novinho","Corajoso","Guerreiro","Herói","Lenda"];
  const doneMissions=missions.filter(m=>m.done).length;

  // ── TELA HISTÓRIA ──────────────────────────────────────────────────────
  if(tela==="historia"&&heroSel){
    const c=heroSel.cenas[cena];
    const isUlt=cena===heroSel.cenas.length-1;
    const prog=((cena+1)/heroSel.cenas.length)*100;
    return(
      <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:c.bg,position:"relative",overflow:"hidden"}}>
        {[0,1,2,3,4].map(i=>(
          <div key={i} style={{position:"absolute",fontSize:22,opacity:0.08,top:`${8+i*18}%`,left:`${4+i*20}%`,animation:`float ${3+i*0.6}s ease ${i*0.3}s infinite`,pointerEvents:"none"}}>{heroSel.emoji}</div>
        ))}
        <div style={{padding:"48px 20px 16px",display:"flex",alignItems:"center",gap:12,flexShrink:0,zIndex:2,position:"relative"}}>
          <button onClick={()=>{clearInterval(timerRef.current);setTela("mapa");setHeroSel(null);setCena(0);}}
            style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:12,width:40,height:40,color:"#fff",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>←</button>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:900,color:heroSel.cor}}>{heroSel.emoji} {heroSel.nome}</div>
            <div style={{height:5,background:"rgba(255,255,255,0.1)",borderRadius:99,marginTop:5,overflow:"hidden"}}>
              <div style={{width:`${prog}%`,height:"100%",borderRadius:99,background:heroSel.cor,transition:"width 0.5s",boxShadow:`0 0 8px ${heroSel.cor}`}}/>
            </div>
          </div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.5)",fontWeight:700}}>{cena+1}/{heroSel.cenas.length}</div>
        </div>

        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"10px 28px 20px",zIndex:2,position:"relative"}}>
          {/* HERO SVG */}
          <div style={{marginBottom:20,animation:c.tipo==="destaque"?"pulse 1s ease infinite":"float 3s ease infinite",filter:`drop-shadow(0 0 24px ${heroSel.cor}99)`}}>
            {heroSel.id==="raio"&&<HeroRaio expressao={c.tipo==="destaque"?"feliz":c.tipo==="acao"?"susto":"normal"} size={c.tipo==="destaque"?180:150}/>}
            {heroSel.id==="escudo"&&<HeroEscudo expressao={c.tipo==="destaque"?"feliz":c.tipo==="bravo"?"bravo":"normal"} size={c.tipo==="destaque"?180:150}/>}
            {heroSel.id==="estrela"&&<HeroEstrela expressao={c.tipo==="destaque"?"feliz":"normal"} size={c.tipo==="destaque"?180:150}/>}
            {heroSel.id==="doutor"&&<HeroDoutor expressao={c.tipo==="destaque"?"feliz":c.tipo==="acao"?"surpreso":"normal"} size={c.tipo==="destaque"?180:150}/>}
          </div>

          {/* Balão de fala */}
          <div style={{
            background:c.tipo==="destaque"?`linear-gradient(135deg,${heroSel.cor}33,${heroSel.cor}18)`:c.tipo==="dica"?"rgba(255,209,102,0.12)":"rgba(255,255,255,0.08)",
            border:c.tipo==="destaque"?`2.5px solid ${heroSel.cor}`:c.tipo==="dica"?"2px solid rgba(255,209,102,0.6)":"1.5px solid rgba(255,255,255,0.18)",
            borderRadius:26,padding:"22px 24px",width:"100%",maxWidth:340,textAlign:"center",
            boxShadow:c.tipo==="destaque"?`0 0 30px ${heroSel.cor}30`:"none",
          }}>
            {/* Rabo do balão */}
            {c.tipo==="destaque"&&<div style={{fontSize:10,color:heroSel.cor,fontWeight:800,letterSpacing:2,marginBottom:8}}>⭐ IMPORTANTE!</div>}
            {c.tipo==="dica"&&<div style={{fontSize:10,color:"#ffd166",fontWeight:800,letterSpacing:2,marginBottom:8}}>💡 DICA ESPECIAL</div>}
            <div style={{fontSize:c.tipo==="destaque"?21:17,fontWeight:c.tipo==="destaque"?900:700,color:c.tipo==="destaque"?heroSel.cor:"#e8f4f8",lineHeight:1.55,marginBottom:c.sub?10:0,minHeight:52}}>
              {textoVis}{digitando&&<span style={{animation:"pulse 0.5s ease infinite",opacity:0.5}}>|</span>}
            </div>
            {c.sub&&!digitando&&<div style={{fontSize:13,color:"rgba(255,255,255,0.6)",lineHeight:1.65,animation:"rise 0.4s ease"}}>{c.sub}</div>}
          </div>
        </div>

        <div style={{padding:"0 28px 40px",flexShrink:0,zIndex:2,position:"relative"}}>
          <button onClick={avancar} style={{width:"100%",padding:"18px",borderRadius:20,border:"none",background:isUlt&&!digitando?`linear-gradient(135deg,${heroSel.cor},${heroSel.cor}cc)`:`rgba(255,255,255,${digitando?0.05:0.12})`,color:isUlt&&!digitando?"#1a1a1a":"#fff",fontWeight:900,fontSize:16,boxShadow:isUlt&&!digitando?`0 6px 24px ${heroSel.cor}55`:"none",display:"flex",alignItems:"center",justifyContent:"center",gap:10,transition:"all 0.3s"}}>
            {digitando?<span style={{fontSize:13}}>Toque para pular ⏭️</span>:isUlt?<><span>🎉 Finalizar!</span><span style={{fontSize:18}}>+8⭐</span></>:<><span>Próximo</span><span style={{fontSize:18}}>➡️</span></>}
          </button>
          {!digitando&&!isUlt&&<div style={{textAlign:"center",marginTop:8,fontSize:10,color:"rgba(255,255,255,0.25)"}}>Toque para continuar a história</div>}
        </div>
        {boom&&<div style={{position:"fixed",top:"40%",left:"50%",fontSize:44,zIndex:9999,pointerEvents:"none",transform:"translateX(-50%)",animation:"rise 0.3s ease"}}>🎉⭐✨🌟</div>}
      </div>
    );
  }

  // ── MISSÕES / TROFÉUS ──────────────────────────────────────────────────
  if(tela==="missoes"||tela==="trofeus"){
    return(
      <div style={{paddingBottom:100}}>
        {boom&&<div style={{position:"fixed",top:"40%",left:"50%",fontSize:44,zIndex:9999,pointerEvents:"none",transform:"translateX(-50%)",animation:"rise 0.3s ease"}}>🎉⭐✨</div>}
        {showLvl&&<div style={{position:"fixed",inset:0,zIndex:9998,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.7)",backdropFilter:"blur(6px)"}}>
          <div style={{background:"linear-gradient(135deg,rgba(255,209,102,0.3),rgba(255,209,102,0.1))",border:"3px solid #ffd166",borderRadius:28,padding:"36px 44px",textAlign:"center",animation:"rise 0.4s ease"}}>
            <div style={{fontSize:54,marginBottom:10}}>🎊</div>
            <div style={{fontSize:13,color:"#ffd166",fontWeight:700,letterSpacing:2,marginBottom:4}}>SUBIU DE NÍVEL!</div>
            <div style={{fontSize:32,fontWeight:900,color:"#ffd166"}}>{lvlNames[Math.min(level-1,4)]}</div>
            <div style={{fontSize:13,color:C.muted,marginTop:8}}>Você está arrasando! ⭐</div>
          </div>
        </div>}
        <div style={{background:"linear-gradient(160deg,#1a0040,#001a3a)",padding:"48px 20px 18px",borderBottom:"1px solid rgba(255,209,102,0.2)"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
            <button onClick={()=>setTela("mapa")} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:12,width:40,height:40,color:"#fff",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
            <div style={{fontSize:18,fontWeight:900,fontFamily:"'Space Grotesk',sans-serif",background:"linear-gradient(135deg,#ffd166,#ff6b9d,#4fc3f7)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
              {tela==="missoes"?"🎯 Missões de Hoje":"🏅 Meus Troféus"}
            </div>
          </div>
          <div style={{background:"rgba(255,255,255,0.07)",border:"1.5px solid rgba(255,209,102,0.4)",borderRadius:18,padding:"12px 16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{background:"linear-gradient(135deg,#ffd166,#ff9f43)",borderRadius:10,padding:"3px 12px",fontSize:12,fontWeight:900,color:"#1a1a1a"}}>Nível {level}</span>
                <span style={{fontSize:11,color:"#ffd166",fontWeight:700}}>{lvlNames[Math.min(level-1,4)]}</span>
              </div>
              <span style={{fontSize:15,fontWeight:900,color:"#ffd166"}}>⭐ {stars}</span>
            </div>
            <div style={{height:8,background:"rgba(255,255,255,0.1)",borderRadius:99,overflow:"hidden"}}>
              <div style={{width:`${xpPct}%`,height:"100%",borderRadius:99,background:"linear-gradient(90deg,#ffd166,#ff9f43,#ff6b9d)",transition:"width 0.6s"}}/>
            </div>
          </div>
        </div>

        <div style={{padding:"20px 20px 0"}}>
          {tela==="missoes"&&(
            <div>
              <div style={{background:"rgba(255,209,102,0.1)",border:"2px solid rgba(255,209,102,0.35)",borderRadius:18,padding:"14px 16px",marginBottom:16,textAlign:"center"}}>
                <div style={{fontSize:26,marginBottom:4}}>{doneMissions===missions.length?"🎉🎉🎉":"🎯"}</div>
                <div style={{fontSize:15,fontWeight:900,color:"#ffd166"}}>{doneMissions===missions.length?"UHUUUU! Você fez tudo!":"Missões de Hoje!"}</div>
                <div style={{display:"flex",justifyContent:"center",gap:5,marginTop:8}}>
                  {missions.map(m=>(<div key={m.id} style={{width:11,height:11,borderRadius:"50%",background:m.done?"#ffd166":"rgba(255,255,255,0.15)",transition:"all 0.3s"}}/>))}
                </div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginTop:5}}>{doneMissions}/{missions.length} completas</div>
              </div>
              {missions.map(m=>(
                <div key={m.id} onClick={()=>doneMission(m.id)} style={{background:m.done?"rgba(255,209,102,0.14)":"rgba(255,255,255,0.05)",border:`2px solid ${m.done?"rgba(255,209,102,0.65)":"rgba(255,255,255,0.1)"}`,borderRadius:18,padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:13,cursor:m.done?"default":"pointer",transition:"all 0.2s"}}>
                  <div style={{width:44,height:44,borderRadius:"50%",flexShrink:0,background:m.done?"linear-gradient(135deg,#ffd166,#ff9f43)":"rgba(255,255,255,0.08)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:m.done?19:23,transition:"all 0.3s"}}>
                    {m.done?"✓":m.emoji}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:800,color:m.done?"rgba(255,255,255,0.45)":C.text,textDecoration:m.done?"line-through":"none"}}>{m.text}</div>
                    {!m.done&&<div style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginTop:2}}>👆 Toque quando fizer!</div>}
                  </div>
                  <div style={{textAlign:"center",flexShrink:0}}>
                    <div style={{fontSize:13,fontWeight:900,color:"#ffd166"}}>+{m.s}⭐</div>
                    <div style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>+{m.xv}xp</div>
                  </div>
                </div>
              ))}
            </div>
          )}
          {tela==="trofeus"&&(
            <div>
              <div style={{background:"linear-gradient(135deg,rgba(255,209,102,0.22),rgba(255,107,157,0.1))",border:"2px solid rgba(255,209,102,0.55)",borderRadius:24,padding:"22px 18px",textAlign:"center",marginBottom:20}}>
                <div style={{fontSize:46,marginBottom:7,animation:"float 2s ease infinite"}}>👑</div>
                <div style={{fontSize:17,fontWeight:900,color:"#ffd166",marginBottom:6}}>Você é incrível!</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.55)",lineHeight:1.7,marginBottom:16}}>Cada sessão é uma batalha que você VENCE! 🌟</div>
                <div style={{display:"flex",justifyContent:"center",gap:0}}>
                  {[["⭐",stars,"Estrelas"],["🏆",level,"Nível"],["✅",doneMissions,"Missões"],["🔥",4,"Dias"]].map(([e,v,l],i)=>(
                    <div key={i} style={{flex:1,textAlign:"center",borderRight:i<3?"1px solid rgba(255,255,255,0.1)":"none",padding:"0 4px"}}>
                      <div style={{fontSize:18,fontWeight:900,color:"#ffd166"}}>{v}</div>
                      <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:2}}>{e} {l}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",fontWeight:700,letterSpacing:2,marginBottom:12}}>SEUS TROFÉUS 🏅</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:24}}>
                {badges.map((b,i)=>(
                  <div key={i} style={{background:b.on?`${b.c}22`:"rgba(255,255,255,0.03)",border:`2.5px solid ${b.on?b.c:"rgba(255,255,255,0.08)"}`,borderRadius:20,padding:"15px 8px",textAlign:"center",filter:b.on?"none":"grayscale(1) opacity(0.28)",boxShadow:b.on?`0 0 18px ${b.c}40`:"none"}}>
                    <div style={{fontSize:30,animation:b.on?"float 3s ease infinite":"none"}}>{b.on?b.e:"🔒"}</div>
                    <div style={{fontSize:11,fontWeight:900,marginTop:6,lineHeight:1.3,color:b.on?b.c:"rgba(255,255,255,0.22)"}}>{b.l}</div>
                  </div>
                ))}
              </div>
              {/* Quiz */}
              <div style={{background:"rgba(255,255,255,0.05)",border:"2px solid rgba(255,209,102,0.4)",borderRadius:20,padding:"18px"}}>
                <div style={{textAlign:"center",marginBottom:10}}>
                  <div style={{fontSize:12,fontWeight:900,color:"#ffd166"}}>🧠 Quiz dos Heróis!</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:2}}>Acerte e ganhe ⭐⭐⭐⭐⭐!</div>
                </div>
                <div style={{fontSize:30,textAlign:"center",marginBottom:8}}>{quizzes[qIdx].e}</div>
                <div style={{fontSize:14,fontWeight:800,textAlign:"center",marginBottom:12,lineHeight:1.5}}>{quizzes[qIdx].p}</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {quizzes[qIdx].ops.map((op,i)=>{
                    const isc=i===quizzes[qIdx].c,issl=qAns===i;
                    let bg="rgba(255,255,255,0.06)",bd="1.5px solid rgba(255,255,255,0.15)",cl=C.text;
                    if(qAns!==null){if(isc){bg="rgba(0,201,177,0.22)";bd=`2px solid ${C.teal}`;cl=C.teal;}else if(issl){bg="rgba(255,107,157,0.18)";bd=`2px solid ${C.pink}`;cl=C.pink;}}
                    return(<button key={i} onClick={()=>qAns===null&&answerQ(i)} style={{background:bg,border:bd,borderRadius:12,padding:"11px 13px",color:cl,fontSize:13,fontWeight:700,textAlign:"left"}}>{qAns!==null&&isc?"✅ ":qAns!==null&&issl?"❌ ":"  "}{op}</button>);
                  })}
                </div>
                {qAns!==null&&(
                  <div style={{marginTop:12,background:qAns===quizzes[qIdx].c?"rgba(0,201,177,0.14)":"rgba(255,107,157,0.12)",borderRadius:12,padding:"13px",textAlign:"center",animation:"rise 0.3s ease"}}>
                    <div style={{fontSize:22,marginBottom:5}}>{qAns===quizzes[qIdx].c?"🎉🎉🎉":"💪 Quase!"}</div>
                    <div style={{fontSize:13,fontWeight:700,marginBottom:7}}>{quizzes[qIdx].ok}</div>
                    {qAns===quizzes[qIdx].c&&<div style={{fontSize:12,color:"#ffd166",fontWeight:800,marginBottom:7}}>+5⭐ +30XP!</div>}
                    <button onClick={()=>{setQIdx(i=>(i+1)%quizzes.length);setQAns(null);}} style={{background:"linear-gradient(135deg,#ffd166,#ff9f43)",border:"none",borderRadius:10,padding:"9px 20px",color:"#1a1a1a",fontWeight:900,fontSize:13}}>Próxima! ➡️</button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ── MAPA DOS HERÓIS ──────────────────────────────────────────────────────
  return(
    <div style={{paddingBottom:100,background:"linear-gradient(180deg,#080020,#001020,#000a14)"}}>
      {boom&&<div style={{position:"fixed",top:"40%",left:"50%",fontSize:44,zIndex:9999,pointerEvents:"none",transform:"translateX(-50%)",animation:"rise 0.3s ease"}}>🎉⭐✨</div>}
      {showLvl&&<div style={{position:"fixed",inset:0,zIndex:9998,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.7)"}}>
        <div style={{background:"linear-gradient(135deg,rgba(255,209,102,0.3),rgba(255,209,102,0.1))",border:"3px solid #ffd166",borderRadius:28,padding:"36px 44px",textAlign:"center",animation:"rise 0.4s ease"}}>
          <div style={{fontSize:54,marginBottom:10}}>🎊</div>
          <div style={{fontSize:13,color:"#ffd166",fontWeight:700,letterSpacing:2,marginBottom:4}}>SUBIU DE NÍVEL!</div>
          <div style={{fontSize:32,fontWeight:900,color:"#ffd166"}}>{lvlNames[Math.min(level-1,4)]}</div>
        </div>
      </div>}

      <div style={{padding:"48px 20px 0",background:"linear-gradient(180deg,#100030,transparent)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
          <BackBtn onBack={onBack}/>
          <div>
            <div style={{fontSize:20,fontWeight:900,fontFamily:"'Space Grotesk',sans-serif",background:"linear-gradient(135deg,#ffd166,#ff6b9d,#4fc3f7)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>🌈 Mundo dos Heróis!</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>Escolha um herói e ouça a história!</div>
          </div>
